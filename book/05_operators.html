<body><p><a href="../playground.html?mode=docs&chapter=05_operators">Open Operators in the Yodl guide</a></p><noscript><article><h1 id="operators"><a class="heading-anchor" href="#operators">Operators</a></h1>
<h2 id="unary-operators"><a class="heading-anchor" href="#unary-operators">Unary Operators</a></h2>
<table>
<thead>
<tr><th>Operator</th><th>Description</th><th>Example</th></tr>
</thead>
<tbody>
<tr><td><code>-</code></td><td>Arithmetic negation</td><td><code>-x</code></td></tr>
<tr><td><code>not</code></td><td>Bitwise NOT</td><td><code>not x</code></td></tr>
<tr><td><code>andr</code></td><td>AND reduction</td><td><code>andr x</code></td></tr>
<tr><td><code>orr</code></td><td>OR reduction</td><td><code>orr x</code></td></tr>
<tr><td><code>xorr</code></td><td>XOR reduction</td><td><code>xorr x</code></td></tr>
</tbody>
</table>
<h3 id="reduction-operators"><a class="heading-anchor" href="#reduction-operators">Reduction Operators</a></h3>
<p>Reduction operators apply the corresponding logic operation across all bits of the operand, returning a single bit result.</p>
<section class="code-example" id="ex-reduction-operators" aria-label="Example: reduction operators">
    <div class="example-header"><span class="example-file">ex-reduction-operators.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: reduction operators"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let all_ones: u1" aria-label="all_ones: let all_ones: u1">all_ones</span> <span class="token-punct">=</span> <span class="token-punct">andr</span> <span class="token-number">8&#39;b11111111</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="let all_ones: u1" aria-label="all_ones: let all_ones: u1">all_ones</span> <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u1" aria-label="1: u1">1</span>)</span></div><div class="code-line"><span class="ln">3</span><span class="lt"> </span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let any_one: u1" aria-label="any_one: let any_one: u1">any_one</span> <span class="token-punct">=</span> <span class="token-punct">orr</span> <span class="token-number">8&#39;b00000001</span></span></div><div class="code-line"><span class="ln">5</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="let any_one: u1" aria-label="any_one: let any_one: u1">any_one</span> <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u1" aria-label="1: u1">1</span>)</span></div><div class="code-line"><span class="ln">6</span><span class="lt"> </span></div><div class="code-line"><span class="ln">7</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let parity: u1" aria-label="parity: let parity: u1">parity</span> <span class="token-punct">=</span> <span class="token-punct">xorr</span> <span class="token-number">8&#39;b10101010</span></span></div><div class="code-line"><span class="ln">8</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="let parity: u1" aria-label="parity: let parity: u1">parity</span> <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u1" aria-label="0: u1">0</span>)</span></div></div>
    
    </section>
<h2 id="binary-operators"><a class="heading-anchor" href="#binary-operators">Binary Operators</a></h2>
<h3 id="arithmetic-operators"><a class="heading-anchor" href="#arithmetic-operators">Arithmetic Operators</a></h3>
<table>
<thead>
<tr><th>Operator</th><th>Description</th><th>Example</th></tr>
</thead>
<tbody>
<tr><td><code>+</code></td><td>Addition</td><td><code>a + b</code></td></tr>
<tr><td><code>-</code></td><td>Subtraction</td><td><code>a - b</code></td></tr>
<tr><td><code>*</code></td><td>Multiplication</td><td><code>a * b</code></td></tr>
<tr><td><code>/</code></td><td>Division</td><td><code>a / b</code></td></tr>
<tr><td><code>mod</code></td><td>Modulo</td><td><code>a mod b</code></td></tr>
</tbody>
</table>
<h3 id="bitwise-operators"><a class="heading-anchor" href="#bitwise-operators">Bitwise Operators</a></h3>
<table>
<thead>
<tr><th>Operator</th><th>Description</th><th>Example</th></tr>
</thead>
<tbody>
<tr><td><code>and</code></td><td>Bitwise AND</td><td><code>a and b</code></td></tr>
<tr><td><code>or</code></td><td>Bitwise OR</td><td><code>a or b</code></td></tr>
<tr><td><code>xor</code></td><td>Bitwise XOR</td><td><code>a xor b</code></td></tr>
<tr><td><code>nand</code></td><td>Bitwise NAND</td><td><code>a nand b</code></td></tr>
<tr><td><code>nor</code></td><td>Bitwise NOR</td><td><code>a nor b</code></td></tr>
<tr><td><code>xnor</code></td><td>Bitwise XNOR</td><td><code>a xnor b</code></td></tr>
<tr><td><code>shl</code></td><td>Shift Left</td><td><code>a shl b</code></td></tr>
<tr><td><code>shr</code></td><td>Shift Right</td><td><code>a shr b</code></td></tr>
</tbody>
</table>
<p>Note 1: When the shift amount (the right hand side) in a <code>shr</code> operation is signed (<code>sint</code> type), the operation corresponds to an arithmetic shift right.</p>
<p>Note 2: The <code>and</code>, <code>or</code>, <code>xor</code>, <code>nand</code>, <code>nor</code>, and <code>xnor</code> operators are used both to perform bitwise and logical operations.</p>
<h3 id="comparison-operators"><a class="heading-anchor" href="#comparison-operators">Comparison Operators</a></h3>
<table>
<thead>
<tr><th>Operator</th><th>Description</th><th>Example</th></tr>
</thead>
<tbody>
<tr><td><code>==</code></td><td>Equal</td><td><code>a == b</code></td></tr>
<tr><td><code>!=</code></td><td>Not Equal</td><td><code>a != b</code></td></tr>
<tr><td><code>&lt;</code></td><td>Less Than</td><td><code>a &lt; b</code></td></tr>
<tr><td><code>&gt;</code></td><td>Greater Than</td><td><code>a &gt; b</code></td></tr>
<tr><td><code>&lt;=</code></td><td>Less Than or Equal</td><td><code>a &lt;= b</code></td></tr>
<tr><td><code>&gt;=</code></td><td>Greater Than or Equal</td><td><code>a &gt;= b</code></td></tr>
</tbody>
</table>
<h2 id="ternary-operator"><a class="heading-anchor" href="#ternary-operator">Ternary Operator</a></h2>
<p>The ternary operator is a concise way to express conditional expressions, generally spanning a single line.</p>
<section class="code-example" id="ex-ternary-operator" aria-label="Example: ternary operator">
    <div class="example-header"><span class="example-file">ex-ternary-operator.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: ternary operator"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let max: u8" aria-label="max: let max: u8">max</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="input a: u8" aria-label="a: input a: u8">a</span> <span class="token-punct">&gt;=</span> <span class="token-ident" tabindex="0" data-code-info="input b: u8" aria-label="b: input b: u8">b</span> <span class="token-punct">?</span> <span tabindex="0" data-code-info="u8" aria-label="a: u8">a</span> <span class="token-punct">:</span> <span class="token-ident" tabindex="0" data-code-info="input b: u8" aria-label="b: input b: u8">b</span></span></div></div>
    
    </section>
<h2 id="concatenation"><a class="heading-anchor" href="#concatenation">Concatenation</a></h2>
<p>Integer concatenation is performed with the <code>cat!</code> built-in function:</p>
<section class="code-example" id="ex-concatenation" aria-label="Example: concatenation">
    <div class="example-header"><span class="example-file">ex-concatenation.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: concatenation"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let upper_nibble: u8" aria-label="upper_nibble: let upper_nibble: u8">upper_nibble</span> <span class="token-punct">=</span> <span class="token-number" tabindex="0" data-code-info="u8" aria-label="8&#39;hAB: u8">8&#39;hAB</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let lower_nibble: u8" aria-label="lower_nibble: let lower_nibble: u8">lower_nibble</span> <span class="token-punct">=</span> <span class="token-number" tabindex="0" data-code-info="u8" aria-label="8&#39;hCD: u8">8&#39;hCD</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let word: u16" aria-label="word: let word: u16">word</span> <span class="token-punct">=</span> <span class="token-function" tabindex="0" data-code-info="cat!(values...) -&gt; uint" aria-label="cat!: cat!(values...) -&gt; uint">cat!</span>(<span class="token-ident" tabindex="0" data-code-info="let upper_nibble: u8" aria-label="upper_nibble: let upper_nibble: u8">upper_nibble</span>, <span class="token-ident" tabindex="0" data-code-info="let lower_nibble: u8" aria-label="lower_nibble: let lower_nibble: u8">lower_nibble</span>)</span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="let word: u16" aria-label="word: let word: u16">word</span> <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u16" aria-label="16&#39;hABCD: u16">16&#39;hABCD</span>)</span></div></div>
    
    </section>
<p><code>cat!</code> also accepts Vectors of integers, which it flattens automatically.</p>
<section class="code-example" id="ex-concatenation-2" aria-label="Example: concatenation 2">
    <div class="example-header"><span class="example-file">ex-concatenation-2.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: concatenation 2"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let value: u4" aria-label="value: let value: u4">value</span> <span class="token-punct">=</span> <span class="token-function" tabindex="0" data-code-info="cat!(values...) -&gt; uint" aria-label="cat!: cat!(values...) -&gt; uint">cat!</span>([<span class="token-number" tabindex="0" data-code-info="u1" aria-label="1&#39;1: u1">1&#39;1</span>, <span class="token-number" tabindex="0" data-code-info="u1" aria-label="1&#39;0: u1">1&#39;0</span>, <span class="token-number" tabindex="0" data-code-info="u1" aria-label="1&#39;0: u1">1&#39;0</span>, <span class="token-number" tabindex="0" data-code-info="u1" aria-label="1&#39;0: u1">1&#39;0</span>]) <span class="token-comment">// 4&#39;b1000</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="let value: u4" aria-label="value: let value: u4">value</span> <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u4" aria-label="4&#39;b1000: u4">4&#39;b1000</span>)</span></div></div>
    
    </section>
<h2 id="slicing-and-indexing"><a class="heading-anchor" href="#slicing-and-indexing">Slicing and Indexing</a></h2>
<p>Elements of vectors and bits of integers can be accessed using the <code>[]</code> operator:</p>
<section class="code-example" id="ex-slicing-and-indexing" aria-label="Example: slicing and indexing">
    <div class="example-header"><span class="example-file">ex-slicing-and-indexing.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: slicing and indexing"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let bits: [8]u1" aria-label="bits: let bits: [8]u1">bits</span> <span class="token-punct">=</span> [<span class="token-punct">..</span><span class="token-number" tabindex="0" data-code-info="u8" aria-label="8&#39;d233: u8">8&#39;d233</span>]</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let first: u1" aria-label="first: let first: u1">first</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="let bits: [8]u1" aria-label="bits: let bits: [8]u1">bits</span>[<span class="token-number" tabindex="0" data-code-info="u1" aria-label="0: u1">0</span>]      <span class="token-comment">// Access the first element</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let nibble: [4]u1" aria-label="nibble: let nibble: [4]u1">nibble</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="let bits: [8]u1" aria-label="bits: let bits: [8]u1">bits</span>[<span class="token-number" tabindex="0" data-code-info="u3" aria-label="7: u3">7</span><span class="token-punct">:</span><span class="token-number" tabindex="0" data-code-info="u3" aria-label="4: u3">4</span>]   <span class="token-comment">// Extract a range of bits (inclusive)</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let byte_desc: [8]u1" aria-label="byte_desc: let byte_desc: [8]u1">byte_desc</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="let bits: [8]u1" aria-label="bits: let bits: [8]u1">bits</span>[<span class="token-number" tabindex="0" data-code-info="u3" aria-label="7: u3">7</span><span class="token-punct">-:</span><span class="token-number" tabindex="0" data-code-info="u4" aria-label="8: u4">8</span>] <span class="token-comment">// 8 bits ending at bit 7 (equivalent to bits[7:0])</span></span></div><div class="code-line"><span class="ln">5</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let byte_asc: [8]u1" aria-label="byte_asc: let byte_asc: [8]u1">byte_asc</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="let bits: [8]u1" aria-label="bits: let bits: [8]u1">bits</span>[<span class="token-number" tabindex="0" data-code-info="u1" aria-label="0: u1">0</span><span class="token-punct">+:</span><span class="token-number" tabindex="0" data-code-info="u4" aria-label="8: u4">8</span>]  <span class="token-comment">// 8 bits starting at bit 0 (equivalent to bits[7:0])</span></span></div><div class="code-line"><span class="ln">6</span><span class="lt"> </span></div><div class="code-line"><span class="ln">7</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="let first: u1" aria-label="first: let first: u1">first</span> <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u1" aria-label="1&#39;b1: u1">1&#39;b1</span>)</span></div><div class="code-line"><span class="ln">8</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-function" tabindex="0" data-code-info="uint!(value: sint) -&gt; uint" aria-label="uint!: uint!(value: sint) -&gt; uint">uint!</span>(<span class="token-ident" tabindex="0" data-code-info="let nibble: [4]u1" aria-label="nibble: let nibble: [4]u1">nibble</span>) <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u4" aria-label="4&#39;hE: u4">4&#39;hE</span>)</span></div><div class="code-line"><span class="ln">9</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-function" tabindex="0" data-code-info="uint!(value: sint) -&gt; uint" aria-label="uint!: uint!(value: sint) -&gt; uint">uint!</span>(<span class="token-ident" tabindex="0" data-code-info="let byte_desc: [8]u1" aria-label="byte_desc: let byte_desc: [8]u1">byte_desc</span>) <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u8" aria-label="8&#39;hE9: u8">8&#39;hE9</span>)</span></div><div class="code-line"><span class="ln">10</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-function" tabindex="0" data-code-info="uint!(value: sint) -&gt; uint" aria-label="uint!: uint!(value: sint) -&gt; uint">uint!</span>(<span class="token-ident" tabindex="0" data-code-info="let byte_asc: [8]u1" aria-label="byte_asc: let byte_asc: [8]u1">byte_asc</span>) <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u8" aria-label="8&#39;hE9: u8">8&#39;hE9</span>)</span></div></div>
    
    </section>
<p>There are three forms of bit slicing:</p>
<ol>
<li><code>[high:low]</code> - Extract bits from position <code>high</code> down to <code>low</code> (inclusive)</li>
<li><code>[base-:width]</code> - Extract <code>width</code> bits ending at <code>base</code> (selects <code>[base : base - width + 1]</code>)</li>
<li><code>[base+:width]</code> - Extract <code>width</code> bits starting at <code>base</code> (selects <code>[base + width - 1 : base]</code>)</li>
</ol>
<p>The <code>+:</code> and <code>-:</code> forms match SystemVerilog's indexed part-select syntax</p>
<p>Note:</p>
<ul>
<li>Integers are indexed from the least significant bit (LSB) to the most significant bit (MSB) (right to left).</li>
<li>Vectors follow standard array-indexing conventions, with the first element at index 0 (left to right).</li>
</ul>
<p>When a bit vector (<code>[N]bool</code> i.e. <code>[N]u1</code>) is used as the argument of the <code>uint</code> and <code>sint</code> built-in functions,
the first element of the vector becomes the MSB of the resulting integer:</p>
<section class="code-example" id="ex-slicing-and-indexing-2" aria-label="Example: slicing and indexing 2">
    <div class="example-header"><span class="example-file">ex-slicing-and-indexing-2.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>

<h2 id="replication"><a class="heading-anchor" href="#replication">Replication</a></h2>
<p>The <code>fill!(n, x)</code> built-in produces a vector <code>[n]T</code> of <code>n</code> copies of <code>x</code>:</p>
<section class="code-example" id="ex-replication" aria-label="Example: replication">

    <div class="code-lines" tabindex="0" role="region" aria-label="Source: replication"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let zeros: [4]u1" aria-label="zeros: let zeros: [4]u1">zeros</span> <span class="token-punct">=</span> <span class="token-function" tabindex="0" data-code-info="fill!(count: Nat, value) -&gt; vector" aria-label="fill!: fill!(count: Nat, value) -&gt; vector">fill!</span>(<span class="token-number" tabindex="0" data-code-info="u3" aria-label="4: u3">4</span>, <span class="token-number" tabindex="0" data-code-info="u1" aria-label="1&#39;b0: u1">1&#39;b0</span>)        <span class="token-comment">// [1&#39;b0, 1&#39;b0, 1&#39;b0, 1&#39;b0]</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let ones: u3" aria-label="ones: let ones: u3">ones</span>  <span class="token-punct">=</span> <span class="token-function" tabindex="0" data-code-info="cat!(values...) -&gt; uint" aria-label="cat!: cat!(values...) -&gt; uint">cat!</span>(<span class="token-function" tabindex="0" data-code-info="fill!(count: Nat, value) -&gt; vector" aria-label="fill!: fill!(count: Nat, value) -&gt; vector">fill!</span>(<span class="token-number" tabindex="0" data-code-info="u2" aria-label="3: u2">3</span>, <span class="token-number" tabindex="0" data-code-info="u1" aria-label="1&#39;b1: u1">1&#39;b1</span>))  <span class="token-comment">// Concat-replicate: 3&#39;b111</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"> </span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-function" tabindex="0" data-code-info="uint!(value: sint) -&gt; uint" aria-label="uint!: uint!(value: sint) -&gt; uint">uint!</span>(<span class="token-ident" tabindex="0" data-code-info="let zeros: [4]u1" aria-label="zeros: let zeros: [4]u1">zeros</span>) <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u4" aria-label="4&#39;d0: u4">4&#39;d0</span>)</span></div><div class="code-line"><span class="ln">5</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="let ones: u3" aria-label="ones: let ones: u3">ones</span> <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u3" aria-label="3&#39;b111: u3">3&#39;b111</span>)</span></div></div>
    
    </section>
<p>The repeated expressions can contain any value, including instances:</p>

<h2 id="concatenation-1"><a class="heading-anchor" href="#concatenation-1">Concatenation</a></h2>
<p>The <code>cat!</code> built-in concatenates a list of integers (or integer vectors) into a single integer.
The width of the result is the sum of the widths of the operands.</p>
<p>If any operand is a signed integer (sint), then all operands are required to be signed.</p>

<h2 id="spread"><a class="heading-anchor" href="#spread">Spread</a></h2>
<p>The spread operator <code>..</code> can only appear inside a vector expression and is used to decompose a value into its individual elements.</p>

bel="2: u2">2</span>] <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u8" aria-label="8&#39;h21: u8">8&#39;h21</span>)</span></div><div class="code-line"><span class="ln">12</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="let flat: [3]u2" aria-label="flat: let flat: [3]u2">flat</span>[<span class="token-number" tabindex="0" data-code-info="u1" aria-label="0: u1">0</span>] <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u2" aria-label="2&#39;d1: u2">2&#39;d1</span>)</span></div><div class="code-line"><span class="ln">13</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="let flat: [3]u2" aria-label="flat: let flat: [3]u2">flat</span>[<span class="token-number" tabindex="0" data-code-info="u1" aria-label="1: u1">1</span>] <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u2" aria-label="2&#39;d2: u2">2&#39;d2</span>)</span></div><div class="code-line"><span class="ln">14</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="let flat: [3]u2" aria-label="flat: let flat: [3]u2">flat</span>[<span class="token-number" tabindex="0" data-code-info="u2" aria-label="2: u2">2</span>] <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u2" aria-label="2&#39;d3: u2">2&#39;d3</span>)</span></div></div>

<h2 id="operator-precedence"><a class="heading-anchor" href="#operator-precedence">Operator Precedence</a></h2>
<p>Operators are evaluated in the following order (from highest to lowest precedence):</p>
<ol>
<li>Unary operators (<code>not</code>, <code>-</code>, <code>andr</code>, <code>orr</code>, <code>xorr</code>)</li>
<li>Multiplication, division, modulo (<code>*</code>, <code>/</code>, <code>mod</code>)</li>
<li>Addition, subtraction (<code>+</code>, <code>-</code>)</li>
<li>Shift operations (<code>shl</code>, <code>shr</code>)</li>
<li>Comparisons (<code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>)</li>
<li>Equality operators (<code>==</code>, <code>!=</code>)</li>
<li>Bitwise AND and NAND (<code>and</code>, <code>nand</code>)</li>
<li>Bitwise XOR and XNOR (<code>xor</code>, <code>xnor</code>)</li>
<li>Bitwise OR and NOR (<code>or</code>, <code>nor</code>)</li>
</ol>
<p>Parentheses can be used to override the default precedence order.</p>
<h2 id="resulting-type"><a class="heading-anchor" href="#resulting-type">Resulting Type</a></h2>
<p>The output type of a binary operation is determined by the types of the operands and the operation being performed.</p>
<p>It matches the <a href="https://github.com/chipsalliance/firrtl-spec/blob/main/spec.html#primitive-operations-primitive-operations">FIRRTL specification</a></p>
<p>The following table summarises the resulting type for each operation:</p>
<table>
<thead>
<tr><th>operation</th><th>lhs type</th><th>rhs type</th><th>output type</th></tr>
</thead>
<tbody>
<tr><td><code>+</code>, <code>-</code></td><td><code>uint&lt;A&gt;</code></td><td><code>uint&lt;B&gt;</code></td><td><code>uint&lt;max(A, B) + 1&gt;</code></td></tr>
<tr><td><code>+</code>, <code>-</code></td><td><code>sint&lt;A&gt;</code></td><td><code>sint&lt;B&gt;</code></td><td><code>sint&lt;max(A, B) + 1&gt;</code></td></tr>
<tr><td><code>*</code></td><td><code>uint&lt;A&gt;</code></td><td><code>uint&lt;B&gt;</code></td><td><code>uint&lt;A + B&gt;</code></td></tr>
<tr><td><code>*</code></td><td><code>sint&lt;A&gt;</code></td><td><code>sint&lt;B&gt;</code></td><td><code>sint&lt;A + B&gt;</code></td></tr>
<tr><td><code>/</code></td><td><code>uint&lt;A&gt;</code></td><td><code>uint&lt;B&gt;</code></td><td><code>uint&lt;A&gt;</code></td></tr>
<tr><td><code>/</code></td><td><code>sint&lt;A&gt;</code></td><td><code>sint&lt;B&gt;</code></td><td><code>sint&lt;A + 1&gt;</code></td></tr>
<tr><td><code>mod</code></td><td><code>uint&lt;A&gt;</code></td><td><code>uint&lt;B&gt;</code></td><td><code>uint&lt;min(A, B)&gt;</code></td></tr>
<tr><td><code>mod</code></td><td><code>sint&lt;A&gt;</code></td><td><code>sint&lt;B&gt;</code></td><td><code>sint&lt;min(A, B)&gt;</code></td></tr>
<tr><td><code>==</code>, <code>!=</code>, <code>&lt;</code>, <code>&gt;</code></td><td><code>uint&lt;A&gt;</code></td><td><code>uint&lt;B&gt;</code></td><td><code>u1</code></td></tr>
<tr><td><code>==</code>, <code>!=</code>, <code>&lt;</code>, <code>&gt;</code></td><td><code>sint&lt;A&gt;</code></td><td><code>sint&lt;B&gt;</code></td><td><code>u1</code></td></tr>
<tr><td><code>and</code>, <code>nand</code>, <code>or</code>, <code>nor</code>, <code>xor</code>, <code>xnor</code></td><td><code>uint&lt;A&gt;</code></td><td><code>uint&lt;B&gt;</code></td><td><code>uint&lt;max(A, B)&gt;</code></td></tr>
<tr><td><code>and</code>, <code>nand</code>, <code>or</code>, <code>nor</code>, <code>xor</code>, <code>xnor</code></td><td><code>sint&lt;A&gt;</code></td><td><code>sint&lt;B&gt;</code></td><td><code>uint&lt;max(A, B)&gt;</code></td></tr>
</tbody>
</table>
<h3 id="shift-operations"><a class="heading-anchor" href="#shift-operations">Shift Operations</a></h3>
<p>When the shift amount is known at compile time, the output type is determined as follows:</p>
<table>
<thead>
<tr><th>operation</th><th>lhs type</th><th>shift amount</th><th>output type</th></tr>
</thead>
<tbody>
<tr><td><code>shl</code></td><td><code>uint&lt;A&gt;</code></td><td><code>n</code></td><td><code>uint&lt;A + n&gt;</code></td></tr>
<tr><td><code>shl</code></td><td><code>sint&lt;A&gt;</code></td><td><code>n</code></td><td><code>sint&lt;A + n&gt;</code></td></tr>
<tr><td><code>shr</code></td><td><code>uint&lt;A&gt;</code></td><td><code>n</code></td><td><code>uint&lt;max(A - n, 0)&gt;</code></td></tr>
<tr><td><code>shr</code></td><td><code>sint&lt;A&gt;</code></td><td><code>n</code></td><td><code>sint&lt;max(A - n, 1)&gt;</code></td></tr>
</tbody>
</table>
<p>When the shift amount is not known at compile time, the output type is determined as follows:</p>
<table>
<thead>
<tr><th>operation</th><th>lhs type</th><th>rhs type</th><th>output type</th></tr>
</thead>
<tbody>
<tr><td><code>shl</code></td><td><code>uint&lt;A&gt;</code></td><td><code>uint&lt;B&gt;</code></td><td><code>uint&lt;A + 2^B - 1&gt;</code></td></tr>
<tr><td><code>shl</code></td><td><code>sint&lt;A&gt;</code></td><td><code>uint&lt;B&gt;</code></td><td><code>sint&lt;A + 2^B - 1&gt;</code></td></tr>
<tr><td><code>shr</code></td><td><code>uint&lt;A&gt;</code></td><td><code>uint&lt;B&gt;</code></td><td><code>uint&lt;A&gt;</code></td></tr>
<tr><td><code>shr</code></td><td><code>sint&lt;A&gt;</code></td><td><code>uint&lt;B&gt;</code></td><td><code>sint&lt;A&gt;</code></td></tr>
</tbody>
</table>
