<body><p><a href="../playground.html?mode=docs&chapter=01_presentation">Open Presentation in the Yodl guide</a></p><noscript><article><h1 id="presentation"><a class="heading-anchor" href="#presentation">Presentation</a></h1>
<p>Yodl is a simple and modern behavioural <a href="https://en.wikipedia.org/wiki/Hardware_description_language">Hardware Description Language</a> (HDL) which acts as a lightweight abstraction
layer over the <a href="https://github.com/chipsalliance/firrtl-spec">FIRRTL</a> intermediate representation to describe digital circuits.</p>
<h2 id="design-goals"><a class="heading-anchor" href="#design-goals">Design goals</a></h2>
<h3 id="simple"><a class="heading-anchor" href="#simple">Simple</a></h3>
<ul>
<li>Yodl designs should be easy to read, even for hobbyists without any prior experience with HDLs, this is mainly achieved by using a familiar C/Rust-like syntax and limiting the amount of constructs (no always blocks / processes).</li>
<li>Minimise implementation complexity by choosing an easy to parse syntax and by focusing on a restricted set of features.</li>
</ul>
<h3 id="explicit"><a class="heading-anchor" href="#explicit">Explicit</a></h3>
<ul>
<li>Established HDLs like Verilog suffer from implicit behaviours which can lead to subtle, hard-to-diagnose bugs like implicit signal declarations or implicit wire narrowing and widening.
Yodl enforces strict rules with explicit intent to prevent common mistakes.</li>
</ul>
<h3 id="robust"><a class="heading-anchor" href="#robust">Robust</a></h3>
<ul>
<li>Yodl's type-system can catch many classes of errors before elaboration even begins.</li>
</ul>
</article></noscript></body></html>
