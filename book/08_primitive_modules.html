<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Primitive Modules · Yodl</title><meta name="description" content="Primitive Modules in Yodl. Learn the language with editable examples and inspect the hardware compiler output."><link rel="canonical" href="../playground.html?mode=docs&chapter=08_primitive_modules"><script>location.replace("../playground.html?mode=docs&chapter=08_primitive_modules"+location.hash)</script><style>body{font:16px/1.7 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px}pre{overflow:auto}</style></head>
<body><p><a href="../playground.html?mode=docs&chapter=08_primitive_modules">Open Primitive Modules in the Yodl guide</a></p><noscript><article><h1 id="primitive-modules"><a class="heading-anchor" href="#primitive-modules">Primitive Modules</a></h1>
<p>Yodl provides a few essential modules for building sequential digital circuits.</p>
<h2 id="registers"><a class="heading-anchor" href="#registers">Registers</a></h2>
<p>Registers are fundamental storage elements in digital circuits. They store data between clock cycles.</p>
<h3 id="basic-register"><a class="heading-anchor" href="#basic-register">Basic Register</a></h3>
<section class="code-example" id="ex-basic-register" aria-label="Example: basic register">
    <div class="example-header"><span class="example-file">ex-basic-register.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: basic register"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Counter</span>(clk<span class="token-punct">:</span> <span class="token-type">clock</span>) <span class="token-punct">-&gt;</span> (value<span class="token-punct">:</span> <span class="token-type">u8</span>) {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-keyword">let</span> counter <span class="token-punct">=</span> <span class="token-ident">Reg</span>[<span class="token-type">u8</span>](clk)</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    counter<span class="token-punct">.</span>d <span class="token-punct">=</span> counter<span class="token-punct">.</span>q <span class="token-punct">+</span> <span class="token-number">1&#39;b1</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt">    value <span class="token-punct">=</span> counter<span class="token-punct">.</span>q</span></div><div class="code-line"><span class="ln">5</span><span class="lt">}</span></div></div>
    
    </section>
<h3 id="parameters"><a class="heading-anchor" href="#parameters">Parameters</a></h3>
<table>
<thead>
<tr><th>Parameter</th><th>Sort</th><th>Description</th></tr>
</thead>
<tbody>
<tr><td><code>T</code></td><td><code>Type</code></td><td>Data type of the register</td></tr>
</tbody>
</table>
<h3 id="ports"><a class="heading-anchor" href="#ports">Ports</a></h3>
<table>
<thead>
<tr><th>Port</th><th>Direction</th><th>Type</th><th>Description</th></tr>
</thead>
<tbody>
<tr><td><code>clk</code></td><td>Input</td><td><code>clock</code></td><td>Clock input</td></tr>
<tr><td><code>d</code></td><td>Input</td><td><code>T</code></td><td>Data input (next state)</td></tr>
<tr><td><code>en</code></td><td>Input</td><td><code>bool</code></td><td>Enable signal (optional)</td></tr>
<tr><td><code>rst</code></td><td>Input</td><td><code>bool</code></td><td>Reset signal (optional)</td></tr>
<tr><td><code>q</code></td><td>Output</td><td><code>T</code></td><td>Data output (current state)</td></tr>
</tbody>
</table>
<h3 id="register-with-reset"><a class="heading-anchor" href="#register-with-reset">Register with Reset</a></h3>
<section class="code-example" id="ex-register-with-reset" aria-label="Example: register with reset">
    <div class="example-header"><span class="example-file">ex-register-with-reset.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: register with reset"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Counter</span>(clk<span class="token-punct">:</span> <span class="token-type">clock</span>, rst<span class="token-punct">:</span> <span class="token-type">bool</span>) <span class="token-punct">-&gt;</span> (value<span class="token-punct">:</span> <span class="token-type">u8</span>) {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-keyword">let</span> counter <span class="token-punct">=</span> <span class="token-ident">Reg</span>[<span class="token-type">u8</span>](clk, rst)</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    counter<span class="token-punct">.</span>d <span class="token-punct">=</span> counter<span class="token-punct">.</span>q <span class="token-punct">+</span> <span class="token-number">1&#39;b1</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt">    value <span class="token-punct">=</span> counter<span class="token-punct">.</span>q</span></div><div class="code-line"><span class="ln">5</span><span class="lt">}</span></div></div>
    
    </section>
<p>When <code>rst</code> is asserted, the register's value is synchronously reset to 0.</p>
<h3 id="register-with-enable"><a class="heading-anchor" href="#register-with-enable">Register with Enable</a></h3>
<section class="code-example" id="ex-register-with-enable" aria-label="Example: register with enable">
    <div class="example-header"><span class="example-file">ex-register-with-enable.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: register with enable"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Counter</span>(clk<span class="token-punct">:</span> <span class="token-type">clock</span>, enable<span class="token-punct">:</span> <span class="token-type">bool</span>) <span class="token-punct">-&gt;</span> (value<span class="token-punct">:</span> <span class="token-type">u8</span>) {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-keyword">let</span> counter <span class="token-punct">=</span> <span class="token-ident">Reg</span>[<span class="token-type">u8</span>](clk, en<span class="token-punct">:</span> enable)</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    counter<span class="token-punct">.</span>d <span class="token-punct">=</span> counter<span class="token-punct">.</span>q <span class="token-punct">+</span> <span class="token-number">1&#39;b1</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt">    value <span class="token-punct">=</span> counter<span class="token-punct">.</span>q</span></div><div class="code-line"><span class="ln">5</span><span class="lt">}</span></div></div>
    
    </section>
<p>The register only updates its value when <code>enable</code> is asserted.</p>
<p>The same behaviour can be obtained using the <code>d</code> port only:</p>
<section class="code-example" id="ex-register-with-enable-2" aria-label="Example: register with enable 2">
    <div class="example-header"><span class="example-file">ex-register-with-enable-2.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: register with enable 2"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Counter</span>(clk<span class="token-punct">:</span> <span class="token-type">clock</span>, enable<span class="token-punct">:</span> <span class="token-type">bool</span>) <span class="token-punct">-&gt;</span> (value<span class="token-punct">:</span> <span class="token-type">u8</span>) {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-keyword">let</span> counter <span class="token-punct">=</span> <span class="token-ident">Reg</span>[<span class="token-type">u8</span>](clk)</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    counter<span class="token-punct">.</span>d <span class="token-punct">=</span> enable <span class="token-punct">?</span> counter<span class="token-punct">.</span>q <span class="token-punct">+</span> <span class="token-number">1&#39;b1</span> <span class="token-punct">:</span> counter<span class="token-punct">.</span>q</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    value <span class="token-punct">=</span> counter<span class="token-punct">.</span>q</span></div><div class="code-line"><span class="ln">5</span><span class="lt">}</span></div></div>
    
    </section>
<h3 id="register-with-asynchronous-reset"><a class="heading-anchor" href="#register-with-asynchronous-reset">Register with Asynchronous Reset</a></h3>
<section class="code-example" id="ex-register-with-asynchronous-reset" aria-label="Example: register with asynchronous reset">
    <div class="example-header"><span class="example-file">ex-register-with-asynchronous-reset.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: register with asynchronous reset"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> state <span class="token-punct">=</span> <span class="token-ident">RegAsyncReset</span>[<span class="token-type">u2</span>](clk, rst)</span></div></div>
    
    </section>
<p>With <code>RegAsyncReset</code>, the reset signal is asynchronous and takes effect immediately.</p>
<h2 id="memory"><a class="heading-anchor" href="#memory">Memory</a></h2>
<p>Memories are arrays of registers that can be read from and written to.</p>
<p>Some configurations may be synthesised as block RAMs in FPGAs.</p>
<h3 id="parameters-1"><a class="heading-anchor" href="#parameters-1">Parameters</a></h3>
<table>
<thead>
<tr><th>Parameter</th><th>Sort</th><th>Description</th></tr>
</thead>
<tbody>
<tr><td><code>T</code></td><td><code>Type</code></td><td>Data type of each element</td></tr>
<tr><td><code>Depth</code></td><td><code>Nat</code></td><td>Number of entries</td></tr>
<tr><td><code>ReadPorts</code></td><td><code>Nat</code></td><td>Number of read ports</td></tr>
<tr><td><code>WritePorts</code></td><td><code>Nat</code></td><td>Number of write ports</td></tr>
<tr><td><code>ReadLatency</code></td><td><code>Nat</code></td><td>Cycles to read</td></tr>
<tr><td><code>WriteLatency</code></td><td><code>Nat</code></td><td>Cycles to write</td></tr>
</tbody>
</table>
<h3 id="ports-1"><a class="heading-anchor" href="#ports-1">Ports</a></h3>
<table>
<thead>
<tr><th>Port</th><th>Direction</th><th>Type</th><th>Description</th></tr>
</thead>
<tbody>
<tr><td><code>read</code></td><td>Input</td><td>[<code>ReadPorts</code>](<code>clk</code>: <code>clock</code>, <code>en</code>: <code>bool</code>, <code>addr</code>: <code>uint[clog2!(Depth)]</code>)</td><td>Read port(s)</td></tr>
<tr><td><code>write</code></td><td>Input</td><td>[<code>WritePorts</code>](<code>clk</code>: <code>clock</code>, <code>en</code>: <code>bool</code>, <code>addr</code>: <code>uint[clog2!(Depth)]</code>, <code>data</code>: <code>T</code>, <code>mask</code>: <code>MemoryMask[T]</code>)</td><td>Write port(s)</td></tr>
<tr><td><code>q</code></td><td>Output</td><td>[<code>ReadPorts</code>]<code>T</code></td><td>Read data port(s)</td></tr>
</tbody>
</table>
<h3 id="basic-memory"><a class="heading-anchor" href="#basic-memory">Basic Memory</a></h3>
<section class="code-example" id="ex-basic-memory" aria-label="Example: basic memory">
    <div class="example-header"><span class="example-file">ex-basic-memory.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: basic memory"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">RAM</span>(</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    clk<span class="token-punct">:</span> <span class="token-type">clock</span>,</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    addr<span class="token-punct">:</span> <span class="token-type">u10</span>,</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    write_data<span class="token-punct">:</span> <span class="token-type">u8</span>,</span></div><div class="code-line"><span class="ln">5</span><span class="lt">    write_enable<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">6</span><span class="lt">) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    read_data<span class="token-punct">:</span> <span class="token-type">u8</span>,</span></div><div class="code-line"><span class="ln">8</span><span class="lt">) {</span></div><div class="code-line"><span class="ln">9</span><span class="lt">    <span class="token-keyword">let</span> mem <span class="token-punct">=</span> <span class="token-ident">Memory</span>[</span></div><div class="code-line"><span class="ln">10</span><span class="lt">        <span class="token-ident">T</span><span class="token-punct">:</span> <span class="token-type">u8</span>,           <span class="token-comment">// Data type</span></span></div><div class="code-line"><span class="ln">11</span><span class="lt">        <span class="token-ident">Depth</span><span class="token-punct">:</span> <span class="token-number">1024</span>,          <span class="token-comment">// Number of entries</span></span></div><div class="code-line"><span class="ln">12</span><span class="lt">        <span class="token-ident">ReadPorts</span><span class="token-punct">:</span> <span class="token-number">1</span>,         <span class="token-comment">// Number of read ports</span></span></div><div class="code-line"><span class="ln">13</span><span class="lt">        <span class="token-ident">WritePorts</span><span class="token-punct">:</span> <span class="token-number">1</span>,        <span class="token-comment">// Number of write ports</span></span></div><div class="code-line"><span class="ln">14</span><span class="lt">        <span class="token-ident">ReadLatency</span><span class="token-punct">:</span> <span class="token-number">1</span>,       <span class="token-comment">// Cycles to read</span></span></div><div class="code-line"><span class="ln">15</span><span class="lt">        <span class="token-ident">WriteLatency</span><span class="token-punct">:</span> <span class="token-number">1</span>,      <span class="token-comment">// Cycles to write</span></span></div><div class="code-line"><span class="ln">16</span><span class="lt">    ](</span></div><div class="code-line"><span class="ln">17</span><span class="lt">        read<span class="token-punct">:</span> [(clk<span class="token-punct">:</span> clk, en<span class="token-punct">:</span> <span class="token-keyword">true</span>, addr<span class="token-punct">:</span> addr)],</span></div><div class="code-line"><span class="ln">18</span><span class="lt">        write<span class="token-punct">:</span> [(clk<span class="token-punct">:</span> clk, en<span class="token-punct">:</span> write_enable, addr<span class="token-punct">:</span> addr, data<span class="token-punct">:</span> write_data, mask<span class="token-punct">:</span> <span class="token-keyword">true</span>)],</span></div><div class="code-line"><span class="ln">19</span><span class="lt">    )</span></div><div class="code-line"><span class="ln">20</span><span class="lt"> </span></div><div class="code-line"><span class="ln">21</span><span class="lt">    read_data <span class="token-punct">=</span> mem<span class="token-punct">.</span>q[<span class="token-number">0</span>]</span></div><div class="code-line"><span class="ln">22</span><span class="lt">}</span></div></div>
    
    </section>
<h3 id="memory-with-write-masking"><a class="heading-anchor" href="#memory-with-write-masking">Memory with Write Masking</a></h3>
<p>Write masking allows selective updates to parts of a memory word:</p>
<section class="code-example" id="ex-memory-with-write-masking" aria-label="Example: memory with write masking">
    <div class="example-header"><span class="example-file">ex-memory-with-write-masking.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: memory with write masking"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">ByteAddressableRAM</span>(</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    clk<span class="token-punct">:</span> <span class="token-type">clock</span>,</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    addr<span class="token-punct">:</span> <span class="token-type">u10</span>,</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    write_data<span class="token-punct">:</span> [<span class="token-number">4</span>]<span class="token-type">u8</span>,   <span class="token-comment">// 32-bit word as 4 bytes</span></span></div><div class="code-line"><span class="ln">5</span><span class="lt">    byte_mask<span class="token-punct">:</span> [<span class="token-number">4</span>]<span class="token-type">bool</span>,       <span class="token-comment">// Which bytes to write</span></span></div><div class="code-line"><span class="ln">6</span><span class="lt">    write_enable<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">7</span><span class="lt">) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">8</span><span class="lt">    read_data<span class="token-punct">:</span> <span class="token-type">u32</span>,</span></div><div class="code-line"><span class="ln">9</span><span class="lt">) {</span></div><div class="code-line"><span class="ln">10</span><span class="lt">    <span class="token-keyword">let</span> mem <span class="token-punct">=</span> <span class="token-ident">Memory</span>[</span></div><div class="code-line"><span class="ln">11</span><span class="lt">        <span class="token-ident">T</span><span class="token-punct">:</span> [<span class="token-number">4</span>]<span class="token-type">u8</span>,</span></div><div class="code-line"><span class="ln">12</span><span class="lt">        <span class="token-ident">Depth</span><span class="token-punct">:</span> <span class="token-number">1024</span>,</span></div><div class="code-line"><span class="ln">13</span><span class="lt">        <span class="token-ident">ReadPorts</span><span class="token-punct">:</span> <span class="token-number">1</span>,</span></div><div class="code-line"><span class="ln">14</span><span class="lt">        <span class="token-ident">WritePorts</span><span class="token-punct">:</span> <span class="token-number">1</span>,</span></div><div class="code-line"><span class="ln">15</span><span class="lt">        <span class="token-ident">ReadLatency</span><span class="token-punct">:</span> <span class="token-number">1</span>,</span></div><div class="code-line"><span class="ln">16</span><span class="lt">        <span class="token-ident">WriteLatency</span><span class="token-punct">:</span> <span class="token-number">1</span>,</span></div><div class="code-line"><span class="ln">17</span><span class="lt">    ](</span></div><div class="code-line"><span class="ln">18</span><span class="lt">        read<span class="token-punct">:</span> [(clk<span class="token-punct">:</span> clk, en<span class="token-punct">:</span> <span class="token-keyword">true</span>, addr<span class="token-punct">:</span> addr)],</span></div><div class="code-line"><span class="ln">19</span><span class="lt">        write<span class="token-punct">:</span> [(clk<span class="token-punct">:</span> clk, en<span class="token-punct">:</span> write_enable, addr<span class="token-punct">:</span> addr, data<span class="token-punct">:</span> write_data, mask<span class="token-punct">:</span> byte_mask)],</span></div><div class="code-line"><span class="ln">20</span><span class="lt">    )</span></div><div class="code-line"><span class="ln">21</span><span class="lt"> </span></div><div class="code-line"><span class="ln">22</span><span class="lt">    read_data <span class="token-punct">=</span> <span class="token-function">uint!</span>(mem<span class="token-punct">.</span>q[<span class="token-number">0</span>])</span></div><div class="code-line"><span class="ln">23</span><span class="lt">}</span></div></div>
    
    </section>
<h4 id="mask-type"><a class="heading-anchor" href="#mask-type">Mask Type</a></h4>
<p>Intuitively, the mask type <code>MemoryMask[T]</code> of a data type <code>T</code> matches the structure of <code>T</code> with each ground type (e.g. <code>uint[N]</code>, <code>sint[N]</code>, ..) replaced with <code>bool</code>.</p>
<p>Examples:</p>
<table>
<thead>
<tr><th>Data Type</th><th>Mask Type</th></tr>
</thead>
<tbody>
<tr><td><code>bool</code></td><td><code>bool</code></td></tr>
<tr><td><code>u8</code></td><td><code>bool</code></td></tr>
<tr><td><code>[4]u32</code></td><td><code>[4]bool</code></td></tr>
<tr><td><code>(a: u8, b: u8)</code></td><td><code>(a: bool, b: bool)</code></td></tr>
<tr><td><code>(a: (b: [64]u16, c: bool))</code></td><td><code>(a: (b: [64]bool, c: bool))</code></td></tr>
</tbody>
</table>
<div class="warning">
    Portions of an integer cannot directly be masked in Yodl, just like in Chisel.
    Instead, the integer can be split into smaller parts which can be masked individually.
</div>
<p>To learn more about write masks, check out the <a href="https://github.com/chipsalliance/firrtl-spec/blob/main/spec.html#write-ports">FIRRTL specification</a>.</p>
</article></noscript></body></html>
