<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Data Types · Yodl</title><meta name="description" content="Data Types in Yodl. Learn the language with editable examples and inspect the hardware compiler output."><link rel="canonical" href="../playground.html?mode=docs&chapter=03_data_types"><script>location.replace("../playground.html?mode=docs&chapter=03_data_types"+location.hash)</script><style>body{font:16px/1.7 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px}pre{overflow:auto}</style></head>
<body><p><a href="../playground.html?mode=docs&chapter=03_data_types">Open Data Types in the Yodl guide</a></p><noscript><article><h1 id="data-types"><a class="heading-anchor" href="#data-types">Data Types</a></h1>
<h2 id="ground-types"><a class="heading-anchor" href="#ground-types">Ground Types</a></h2>
<h3 id="integer-types"><a class="heading-anchor" href="#integer-types">Integer types</a></h3>
<p>Yodl supports two integer types, which require a width specifier:</p>
<table>
<thead>
<tr><th>Form</th><th>Example</th><th>When to use</th></tr>
</thead>
<tbody>
<tr><td><code>uN</code> / <code>sN</code></td><td><code>u8</code>, <code>u32</code>, <code>s7</code></td><td>Width is a literal</td></tr>
<tr><td><code>uint[expr]</code> / <code>sint[expr]</code></td><td><code>uint[clog2!(N)]</code>, <code>sint[W + 1]</code></td><td>Width is a compile-time expression</td></tr>
</tbody>
</table>
<h4 id="unsigned-integers"><a class="heading-anchor" href="#unsigned-integers">Unsigned Integers</a></h4>
<section class="code-example" id="ex-unsigned-integers" aria-label="Example: unsigned integers">
    <div class="example-header"><span class="example-file">ex-unsigned-integers.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: unsigned integers"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-comment">// a 16-bit unsigned integer</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> a<span class="token-punct">:</span> <span class="token-type">u16</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt">a <span class="token-punct">=</span> <span class="token-number">16&#39;d1721</span></span></div></div>
    
    </section>
<h4 id="signed-integers"><a class="heading-anchor" href="#signed-integers">Signed Integers</a></h4>
<section class="code-example" id="ex-signed-integers" aria-label="Example: signed integers">
    <div class="example-header"><span class="example-file">ex-signed-integers.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: signed integers"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-comment">// a 7-bit signed integer</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> b<span class="token-punct">:</span> <span class="token-type">s7</span> <span class="token-punct">=</span> <span class="token-punct">-</span><span class="token-number">6&#39;d8</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">let</span> c<span class="token-punct">:</span> <span class="token-type">s32</span> <span class="token-punct">=</span> <span class="token-function">sint!</span>(<span class="token-number">32&#39;d11</span>)</span></div></div>
    
    </section>
<p>Integer literals can be specified in decimal, binary, octal, or hexadecimal format.
The syntax is <code>&lt;width in bits&gt;'[base prefix]&lt;value&gt;</code></p>
<p>The decimal value <code>1621</code> which requires at least 11 bits can be represented as follows:</p>
<table>
<thead>
<tr><th>prefix</th><th>base</th><th>example</th></tr>
</thead>
<tbody>
<tr><td><code>b</code></td><td>2</td><td><code>11'b11001010101</code></td></tr>
<tr><td><code>o</code></td><td>8</td><td><code>11'o3125</code></td></tr>
<tr><td><code>d</code></td><td>10</td><td><code>11'd1621</code></td></tr>
<tr><td><code>h</code></td><td>16</td><td><code>11'h655</code></td></tr>
</tbody>
</table>
<p>When an integer value is assigned to a same-signed integer type, Yodl resizes
it to the destination width. Widening an unsigned value zero-extends it,
widening a signed value sign-extends it, and narrowing keeps the least
significant bits. Unsized literals instead adopt the contextual width when the
value fits. Signedness is never changed implicitly: use <code>uint!(x)</code> or <code>sint!(x)</code>
to request a signedness reinterpretation explicitly.</p>
<p>Without a context, an unsized nonnegative literal synthesizes as an unsigned
integer with its minimum representable width (<code>1</code> is <code>u1</code>, <code>255</code> is <code>u8</code>). In a
<code>uN</code> or <code>sN</code> context it is checked at the literal for overflow and then adopts
that exact type. Negative values are rejected by unsigned contexts and must fit
the two's-complement range of a signed context. Static <code>Nat</code> parameters and
width expressions are evaluated in the separate static/index language; they
are not runtime signal types.</p>
<h3 id="try-a-width-error"><a class="heading-anchor" href="#try-a-width-error">Try a width error</a></h3>
<p>An unsized literal must fit the width supplied by its context. Compile this example to see the
error, then change <code>u8</code> to <code>u9</code> so that the value fits.</p>
<section class="code-example" id="ex-literal-overflow" aria-label="Example: literal overflow">
    <div class="example-header"><span class="example-file">ex-literal-overflow.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: literal overflow"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">WidthError</span>() <span class="token-punct">-&gt;</span> (value<span class="token-punct">:</span> <span class="token-type">u8</span>) {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    value <span class="token-punct">=</span> <span class="token-number">256</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt">}</span></div></div>
    <p class="example-note">This example intentionally produces a compiler error. Compile it to see the diagnostic, or open it in the Playground to explore.</p>
    </section>
<h3 id="booleans"><a class="heading-anchor" href="#booleans">Booleans</a></h3>
<p>The <code>bool</code> type is an alias for the <code>u1</code> type.</p>
<p>For readability, the <code>true</code> and <code>false</code> keywords are supported and correspond to <code>1'b1</code> and <code>1'b0</code> respectively.</p>
<section class="code-example" id="ex-booleans" aria-label="Example: booleans">
    <div class="example-header"><span class="example-file">ex-booleans.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: booleans"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> is_yodl_neat<span class="token-punct">:</span> <span class="token-type">bool</span> <span class="token-punct">=</span> <span class="token-keyword">true</span></span></div></div>
    
    </section>
<h3 id="clocks"><a class="heading-anchor" href="#clocks">Clocks</a></h3>
<p>The <code>clock</code> type is required for clock signals used in <code>Reg</code> and <code>Memory</code> module instances.</p>
<section class="code-example" id="ex-clocks" aria-label="Example: clocks">
    <div class="example-header"><span class="example-file">ex-clocks.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: clocks"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Counter</span>(clk<span class="token-punct">:</span> <span class="token-type">clock</span>) <span class="token-punct">-&gt;</span> (count<span class="token-punct">:</span> <span class="token-type">u24</span>) {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-keyword">let</span> counter <span class="token-punct">=</span> <span class="token-ident">Reg</span>[<span class="token-type">u24</span>](clk)</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    counter<span class="token-punct">.</span>d <span class="token-punct">=</span> counter<span class="token-punct">.</span>q <span class="token-punct">+</span> <span class="token-number">1&#39;d1</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt">    count <span class="token-punct">=</span> counter<span class="token-punct">.</span>q</span></div><div class="code-line"><span class="ln">5</span><span class="lt">}</span></div></div>
    
    </section>
<h2 id="aggregate-types"><a class="heading-anchor" href="#aggregate-types">Aggregate Types</a></h2>
<p>Ground types can be combined to create more complex data structures.</p>
<h2 id="vectors"><a class="heading-anchor" href="#vectors">Vectors</a></h2>
<p>Vectors are ordered and sized collections of elements.</p>
<section class="code-example" id="ex-vectors" aria-label="Example: vectors">
    <div class="example-header"><span class="example-file">ex-vectors.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: vectors"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-comment">// a vector of eight booleans</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> neighbours<span class="token-punct">:</span> [<span class="token-number">8</span>]<span class="token-type">bool</span> <span class="token-punct">=</span> [<span class="token-keyword">false</span>, <span class="token-keyword">false</span>, <span class="token-keyword">true</span>, <span class="token-keyword">false</span>, <span class="token-keyword">true</span>, <span class="token-keyword">false</span>, <span class="token-keyword">true</span>, <span class="token-keyword">false</span>]</span></div><div class="code-line"><span class="ln">3</span><span class="lt"> </span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-comment">// a vector of four 16-bit unsigned integers</span></span></div><div class="code-line"><span class="ln">5</span><span class="lt"><span class="token-keyword">let</span> ints<span class="token-punct">:</span> [<span class="token-number">4</span>]<span class="token-type">u16</span> <span class="token-punct">=</span> [<span class="token-number">16&#39;d1</span>, <span class="token-number">16&#39;d12</span>, <span class="token-number">16&#39;d3</span>, <span class="token-number">16&#39;d4</span>]</span></div></div>
    
    </section>
<blockquote>
<p><strong>Note</strong>: Instead of storing multiple register instances in a vector, define a single register instance with a vector type:</p>
</blockquote>
<section class="code-example" id="ex-vectors-2" aria-label="Example: vectors 2">
    <div class="example-header"><span class="example-file">ex-vectors-2.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: vectors 2"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">RegisterFile</span>(</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    clk<span class="token-punct">:</span> <span class="token-type">clock</span>,</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    rst<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    write_enable<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">5</span><span class="lt">    write_dest<span class="token-punct">:</span> <span class="token-type">u3</span>,</span></div><div class="code-line"><span class="ln">6</span><span class="lt">    write_data<span class="token-punct">:</span> <span class="token-type">u16</span>,</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    read_src1<span class="token-punct">:</span> <span class="token-type">u3</span>,</span></div><div class="code-line"><span class="ln">8</span><span class="lt">    read_src2<span class="token-punct">:</span> <span class="token-type">u3</span>,</span></div><div class="code-line"><span class="ln">9</span><span class="lt">) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">10</span><span class="lt">    read_data1<span class="token-punct">:</span> <span class="token-type">u16</span>,</span></div><div class="code-line"><span class="ln">11</span><span class="lt">    read_data2<span class="token-punct">:</span> <span class="token-type">u16</span>,</span></div><div class="code-line"><span class="ln">12</span><span class="lt">) {</span></div><div class="code-line"><span class="ln">13</span><span class="lt">    <span class="token-comment">// A register storing a vector of eight 16-bit unsigned integers</span></span></div><div class="code-line"><span class="ln">14</span><span class="lt">    <span class="token-keyword">let</span> regs <span class="token-punct">=</span> <span class="token-ident">Reg</span>[[<span class="token-number">8</span>]<span class="token-type">u16</span>](clk, rst)</span></div><div class="code-line"><span class="ln">15</span><span class="lt"> </span></div><div class="code-line"><span class="ln">16</span><span class="lt">    <span class="token-keyword">if</span> write_enable {</span></div><div class="code-line"><span class="ln">17</span><span class="lt">        regs<span class="token-punct">.</span>d[write_dest] <span class="token-punct">=</span> write_data</span></div><div class="code-line"><span class="ln">18</span><span class="lt">    }</span></div><div class="code-line"><span class="ln">19</span><span class="lt"> </span></div><div class="code-line"><span class="ln">20</span><span class="lt">    read_data1 <span class="token-punct">=</span> regs<span class="token-punct">.</span>q[read_src1]</span></div><div class="code-line"><span class="ln">21</span><span class="lt">    read_data2 <span class="token-punct">=</span> regs<span class="token-punct">.</span>q[read_src2]</span></div><div class="code-line"><span class="ln">22</span><span class="lt">}</span></div></div>
    
    </section>
<h2 id="characters-and-strings"><a class="heading-anchor" href="#characters-and-strings">Characters and Strings</a></h2>
<p>Characters use the ISO 8601 encoding (extended ASCII).</p>
<section class="code-example" id="ex-characters-and-strings" aria-label="Example: characters and strings">
    <div class="example-header"><span class="example-file">ex-characters-and-strings.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: characters and strings"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> char<span class="token-punct">:</span> <span class="token-type">u8</span> <span class="token-punct">=</span> &#39;a&#39;</span></div></div>
    
    </section>
<h3 id="escape-sequences"><a class="heading-anchor" href="#escape-sequences">Escape sequences</a></h3>
<table>
<thead>
<tr><th>Sequence</th><th>Description</th></tr>
</thead>
<tbody>
<tr><td><code>\n</code></td><td>Newline</td></tr>
<tr><td><code>\t</code></td><td>Tab</td></tr>
<tr><td><code>\\</code></td><td>Backslash</td></tr>
<tr><td><code>\'</code></td><td>Single quote</td></tr>
</tbody>
</table>
<h3 id="strings"><a class="heading-anchor" href="#strings">Strings</a></h3>
<p>Strings are fixed-length vectors of characters.</p>
<section class="code-example" id="ex-strings" aria-label="Example: strings">
    <div class="example-header"><span class="example-file">ex-strings.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: strings"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> message<span class="token-punct">:</span> [<span class="token-number">9</span>]<span class="token-type">u8</span> <span class="token-punct">=</span> <span class="token-string">&quot;Yo, Yodl!&quot;</span></span></div></div>
    
    </section>
<p>Individual characters can be accessed using the following syntax:</p>
<section class="code-example" id="ex-strings-2" aria-label="Example: strings 2">
    <div class="example-header"><span class="example-file">ex-strings-2.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: strings 2"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> first_char <span class="token-punct">=</span> <span class="token-string">&quot;Yo!&quot;</span>[<span class="token-number">0</span>]</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-function">assert!</span>(first_char <span class="token-punct">==</span> &#39;<span class="token-ident">Y</span>&#39;)</span></div></div>
    
    </section>
<h2 id="records"><a class="heading-anchor" href="#records">Records</a></h2>
<p>Records group a fixed number of values, accessed either by position or by name.
They subsume what other languages call <em>tuples</em> (positional) and <em>structs</em> /
<em>bundles</em> (named).</p>
<span id="tuples"></span><h3 id="positional-records-tuples"><a class="heading-anchor" href="#positional-records-tuples">Positional records (tuples)</a></h3>
<p>Fields are accessed by their index (<code>.0</code>, <code>.1</code>, ...). A 1-element positional
record requires a trailing comma to distinguish it from a parenthesised
expression.</p>
<section class="code-example" id="ex-positional-records-tuples" aria-label="Example: positional records tuples">
    <div class="example-header"><span class="example-file">ex-positional-records-tuples.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: positional records tuples"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> pair<span class="token-punct">:</span> (<span class="token-type">bool</span>, <span class="token-type">u8</span>) <span class="token-punct">=</span> (<span class="token-keyword">true</span>, <span class="token-number">8&#39;hFF</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> single<span class="token-punct">:</span> (<span class="token-type">u8</span>,) <span class="token-punct">=</span> (<span class="token-number">8&#39;hFF</span>,)</span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">let</span> nested<span class="token-punct">:</span> ((a<span class="token-punct">:</span> [<span class="token-number">1</span>]<span class="token-type">u4</span>, b<span class="token-punct">:</span> <span class="token-type">bool</span>), (<span class="token-type">bool</span>, <span class="token-type">u8</span>), <span class="token-type">u1</span>) <span class="token-punct">=</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt">    ((a<span class="token-punct">:</span> [<span class="token-number">4&#39;d1</span>], b<span class="token-punct">:</span> <span class="token-keyword">false</span>), pair, <span class="token-number">1&#39;b0</span>)</span></div><div class="code-line"><span class="ln">5</span><span class="lt"> </span></div><div class="code-line"><span class="ln">6</span><span class="lt"><span class="token-keyword">let</span> first<span class="token-punct">:</span> <span class="token-type">bool</span> <span class="token-punct">=</span> pair<span class="token-punct">.</span><span class="token-number">0</span> <span class="token-comment">// true</span></span></div><div class="code-line"><span class="ln">7</span><span class="lt"><span class="token-keyword">let</span> second<span class="token-punct">:</span> <span class="token-type">u8</span> <span class="token-punct">=</span> pair<span class="token-punct">.</span><span class="token-number">1</span> <span class="token-comment">// 8&#39;hFF</span></span></div></div>
    
    </section>
<span id="structs"></span><h3 id="named-records-structs-bundles"><a class="heading-anchor" href="#named-records-structs-bundles">Named records (structs / bundles)</a></h3>
<p>Fields are named. This is what other HDLs call a <em>bundle</em> (Chisel/FIRRTL) or
<em>struct</em> (SystemVerilog).</p>
<section class="code-example" id="ex-named-records-structs-bundles" aria-label="Example: named records structs bundles">
    <div class="example-header"><span class="example-file">ex-named-records-structs-bundles.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: named records structs bundles"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> colour<span class="token-punct">:</span> (r<span class="token-punct">:</span> <span class="token-type">u8</span>, g<span class="token-punct">:</span> <span class="token-type">u8</span>, b<span class="token-punct">:</span> <span class="token-type">u8</span>) <span class="token-punct">=</span> (r<span class="token-punct">:</span> <span class="token-number">8&#39;d17</span>, g<span class="token-punct">:</span> <span class="token-number">8&#39;d128</span>, b<span class="token-punct">:</span> <span class="token-number">8&#39;d211</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> red <span class="token-punct">=</span> colour<span class="token-punct">.</span>r</span></div></div>
    
    </section>
<p>A named record can be partially updated by spreading another record with <code>..base</code>
followed by overriding fields. Spread is only allowed in named records.</p>
<section class="code-example" id="ex-named-records-structs-bundles-2" aria-label="Example: named records structs bundles 2">
    <div class="example-header"><span class="example-file">ex-named-records-structs-bundles-2.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: named records structs bundles 2"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> base <span class="token-punct">=</span> (r<span class="token-punct">:</span> <span class="token-number">8&#39;d17</span>, g<span class="token-punct">:</span> <span class="token-number">8&#39;d128</span>, b<span class="token-punct">:</span> <span class="token-number">8&#39;d211</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> darker <span class="token-punct">=</span> (<span class="token-punct">..</span>base, r<span class="token-punct">:</span> <span class="token-number">8&#39;d0</span>)</span></div></div>
    
    </section>
<p>Mixing positional and named fields in a single record is not allowed: a record
is either fully positional or fully named.</p>
<h3 id="records-and-module-signatures"><a class="heading-anchor" href="#records-and-module-signatures">Records and module signatures</a></h3>
<p>Because a module's input and output port lists use the same <code>(name: type, ...)</code>
syntax as named record types, a module signature is literally a function from a
record of inputs to a record of outputs. Module instantiation passes a record of
named ports:</p>
<section class="code-example" id="ex-records-and-module-signatures" aria-label="Example: records and module signatures">
    <div class="example-header"><span class="example-file">ex-records-and-module-signatures.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: records and module signatures"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> r <span class="token-punct">=</span> <span class="token-ident">Adder</span>(a<span class="token-punct">:</span> <span class="token-number">8&#39;d1</span>, b<span class="token-punct">:</span> <span class="token-number">8&#39;d2</span>)</span></div></div>
    
    </section>
<h3 id="instance-types"><a class="heading-anchor" href="#instance-types">Instance Types</a></h3>
<p>The type of a module instance behaves like a named record corresponding to the
port signature of the module.</p>
<p>Note: Instance types are not compatible with named record types because only the
ports which are accessed on a particular instance are included in the resulting
type.</p>
<section class="code-example" id="ex-instance-types" aria-label="Example: instance types">
    <div class="example-header"><span class="example-file">ex-instance-types.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: instance types"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Adder</span>(a<span class="token-punct">:</span> <span class="token-type">u8</span>, b<span class="token-punct">:</span> <span class="token-type">u8</span>) <span class="token-punct">-&gt;</span> (sum<span class="token-punct">:</span> <span class="token-type">u9</span>) {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    sum <span class="token-punct">=</span> a <span class="token-punct">+</span> b;</span></div><div class="code-line"><span class="ln">3</span><span class="lt">}</span></div><div class="code-line"><span class="ln">4</span><span class="lt"> </span></div><div class="code-line"><span class="ln">5</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Top</span>() <span class="token-punct">-&gt;</span> () {</span></div><div class="code-line"><span class="ln">6</span><span class="lt">    <span class="token-keyword">let</span> adder <span class="token-punct">=</span> <span class="token-ident">Adder</span>()</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    adder<span class="token-punct">.</span>a <span class="token-punct">=</span> <span class="token-number">8&#39;d1</span></span></div><div class="code-line"><span class="ln">8</span><span class="lt">    adder<span class="token-punct">.</span>b <span class="token-punct">=</span> <span class="token-number">8&#39;d2</span></span></div><div class="code-line"><span class="ln">9</span><span class="lt">    <span class="token-keyword">let</span> sum <span class="token-punct">=</span> adder<span class="token-punct">.</span>sum</span></div><div class="code-line"><span class="ln">10</span><span class="lt">}</span></div></div>
    
    </section>
<h2 id="structural-typing"><a class="heading-anchor" href="#structural-typing">Structural Typing</a></h2>
<p>Yodl's type system is structural (except for instance types), which means that two types are compatible if they have the same shape.</p>
<table>
<thead>
<tr><th>Type A</th><th>Type B</th><th>Compatible?</th></tr>
</thead>
<tbody>
<tr><td><code>u8</code></td><td><code>u8</code></td><td>Yes</td></tr>
<tr><td><code>u1</code></td><td><code>bool</code></td><td>Yes</td></tr>
<tr><td><code>(a: u16, b: bool)</code></td><td><code>(b: bool, a: u16)</code></td><td>Yes</td></tr>
<tr><td><code>(a: u16, b: bool)</code></td><td><code>(a: u16)</code></td><td>No</td></tr>
<tr><td><code>(a: u16, b: bool)</code></td><td><code>(a: u16, b: bool, c: [7]bool)</code></td><td>No</td></tr>
<tr><td><code>[8][8]u8</code></td><td><code>[64]u8</code></td><td>No</td></tr>
<tr><td><code>Adder</code></td><td><code>Adder</code></td><td>Yes</td></tr>
<tr><td><code>Adder</code></td><td><code>(a: u8, b: u8, sum: u9)</code></td><td>No</td></tr>
</tbody>
</table>
