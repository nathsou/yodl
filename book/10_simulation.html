<h2 id="procedural-testbenches"><a class="heading-anchor" href="#procedural-testbenches">Procedural testbenches</a></h2>
<p>Testbenches live beside hardware modules and run with the native simulator.
The <code>test</code> command runs every test in a source file; pass a test name to run
only that test. A test may bind a module with <code>for</code>, which brings its ports into
scope, or instantiate a DUT locally when it needs an unbound test.
In the playground, open the <strong>Tests</strong> tab of the output pane (it appears when the
source contains tests) to run the same testbenches in the browser.</p>

<p>Each row of the XOR table is a three-bit <code>a, b, out</code> value. The test indexes
the constant table to drive the inputs and check its expected output.</p>
<table>
<thead>
<tr><th>Builtin</th><th>Form</th><th>Effect</th></tr>
</thead>
<tbody>
<tr><td><code>drive!</code></td><td><code>drive!(input, value)</code></td><td>Drives an input port and settles combinational logic.</td></tr>
<tr><td><code>expect!</code></td><td><code>expect!(signal, value)</code></td><td>Checks a settled port value. The test fails when it differs.</td></tr>
<tr><td><code>peek!</code></td><td><code>peek!(signal)</code></td><td>Reads a port value for use in a test expression or local binding.</td></tr>
<tr><td><code>settle!</code></td><td><code>settle!()</code></td><td>Settles combinational logic without advancing time.</td></tr>
<tr><td><code>step!</code></td><td><code>step!(cycles)</code></td><td>Advances the bound DUT's sole clock by complete cycles.</td></tr>
<tr><td><code>step!</code></td><td><code>step!(clock, cycles)</code></td><td>Advances the named clock by complete cycles. Required when a DUT has multiple clocks, and used by unbound tests.</td></tr>
</tbody>
</table>
<p>Bound tests refer to ports directly. Unbound tests qualify ports with their DUT
binding, such as <code>dut.out</code>. Generic DUTs are supported in a bound declaration
such as <code>for Counter[8]</code>.</p>
<p>Local DUT declarations select the module to simulate; their connection list
must be empty. Use <code>drive!</code> for test stimulus after <code>let dut = Module()</code>.
Integer expressions and values returned by <code>peek!</code> may be stored in lexical
<code>let</code> or <code>const</code> bindings and composed in later test expressions.</p>
<p>Tests are host-side programs and do not add hardware to the emitted FIRRTL.
The DUT instances are still monomorphized, so a parameterized DUT used only by
a test is available to the simulator. Module-level <code>assert!</code>, <code>printf!</code>, and
<code>stop!</code> retain their clocked FIRRTL semantics and can be used alongside a
procedural test.</p>
<p>Yodl's simulator executes the normalized, typed FIRRTL produced by the
compiler. It is intended for deterministic testbenches and for interactive
playground tools; it does not model gate delays or analogue timing.</p>
<p>The low-level API accepts typed FIRRTL and prepares it into an executable
design. <code>Simulator::from_circuit</code> remains a compatibility wrapper; hosts that
run multiple instances should prepare once and reuse the compiled design:</p>
<pre><code class="language-moonbit">let sim = @simulator.Simulator::from_circuit(circuit, &quot;Top&quot;)
sim.poke(&quot;rst&quot;, @simulator.SimValue::from_int(1, 1))
sim.step_clock(&quot;clk&quot;)
let value = sim.peek(&quot;counter&quot;)
</code></pre>
<p>For procedural tests, wrap it in a testbench. <code>step</code> performs a rising and
falling edge, while <code>run</code> repeats that operation and tracks the cycle count.</p>
<pre><code class="language-moonbit">let tb = sim.testbench()
tb.poke(&quot;rst&quot;, @simulator.SimValue::from_int(1, 1))
tb.run(&quot;clk&quot;, 2)
tb.expect(&quot;done&quot;, @simulator.SimValue::from_int(1, 1))
</code></pre>
<p>Values are arbitrary-width packed integers. A value can be marked unknown with
<code>SimValue::new(..., known=false)</code>; unreset registers and uninitialised memory
locations start unknown. This prevents a test from accidentally relying on an
implicit zero initialisation. Unknownness is tracked per bit and unknown
backing bits are canonicalized. <code>is_known()</code> is true only when every valid bit
is known; extraction, concatenation, shifts, bitwise operations, masked writes,
and muxes preserve bits that can be proven known. Arithmetic uses a documented
conservative whole-result rule.</p>
<p><code>poke</code> changes an input and <code>settle</code> reaches a stable combinational result,
including asynchronous reset effects, without advancing a cycle. A rising
edge samples register inputs, memory controls, and clocked commands from one
settled state. Register and memory updates become visible together, followed
by another settle; a <code>stop!</code> completes its triggering edge. The simulator
settles combinational connections between clock events, commits
registers and synchronous memories together on a rising edge, and executes
clocked <code>printf!</code>, <code>assert!</code>, and <code>stop!</code> commands. A combinational loop or an
external module without a registered simulation model is reported as an error.</p>
<p>Clocked commands require a real input clock (direct aliases are allowed;
derived clocks are rejected). Constant assertions are folded at compile time.
Unsupported memory latencies and unsupported indexing fail during preparation.
Outcomes expose persistent assertion failure separately from halting and
preserve nonzero stop codes. <code>drain_events()</code> returns typed printf/assertion
events incrementally; native testbenches may opt into full history.</p>
<p>For long-running tests, the evaluator compiles typed FIRRTL into a small
SimIR worklist. Only statements affected by a changed input, register, memory,
or child output are revisited, and machine-word primitive operations avoid
allocating arbitrary-precision temporaries for the common narrow-control paths.
The resulting cycle/settle API is deterministic while remaining suitable for a
future bytecode backend.</p>
<p>Transition tracing is opt-in, so normal simulation remains fast:</p>
<pre><code class="language-moonbit">sim.enable_waveform(signals=[&quot;valid&quot;, &quot;ready&quot;])
sim.step_clock(&quot;clk&quot;)
for sample in sim.waveform() {
  println(&quot;{sample.cycle()}: {sample.signal()} = {sample.value()}&quot;)
}
</code></pre>
<p>External FIRRTL modules can be supplied by a host model. The model receives its
input values and returns output values in declared port order:</p>
<pre><code class="language-moonbit">let models : Map[String, @simulator.PrimitiveModel] = Map([])
models[&quot;TimerIP&quot;] = {
  evaluate: (_) =&gt; [@simulator.SimValue::from_int(1, 1)],
}
let sim = @simulator.Simulator::from_circuit_with_models(circuit, &quot;Top&quot;, models)
</code></pre>
<p>Graphical and text-producing designs can expose semantic output protocols to a
simulation host. <code>Framebuffer</code> stores RGB pixels for a browser canvas, and
<code>TextSink</code> collects byte-oriented output. A hardware wrapper can connect those
same logical signals to a physical display or serial link when targeting an
FPGA, but the simulation top does not need those timing signals.</p>
<p>The playground uses this separation for the Game of Life example: <code>GameOfLifeSim</code>
loads its 30×40 vector register in one cycle, advances one generation per
clock, and returns the aggregate state as a framebuffer.</p>
<p>A simulation display can be a logical array or a pixel stream. The compiler
binds displays to typed outputs; signal names do not need a special prefix.
A sole two-dimensional unsigned output is detected automatically. Use
<code>display: { buffer: &quot;name&quot; }</code> to choose between multiple arrays.</p>
<section class="code-example" id="ex-simulation-annotation" aria-label="Example: simulation annotation">
    <div class="example-header"><span class="example-file">ex-simulation-annotation.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: simulation annotation"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-punct">@</span>simulation({ display<span class="token-punct">:</span> { buffer<span class="token-punct">:</span> <span class="token-string">&quot;pixel&quot;</span> }, reset<span class="token-punct">:</span> <span class="token-string">&quot;rst&quot;</span> })</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident" tabindex="0" data-code-info="module VisualSim(clk: clock, rst: u1) -&gt; (pixel: [30][40]u1)" aria-label="VisualSim: module VisualSim(clk: clock, rst: u1) -&gt; (pixel: [30][40]u1)">VisualSim</span>(<span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span><span class="token-punct">:</span> <span class="token-type">clock</span>, <span class="token-ident" tabindex="0" data-code-info="input rst: u1" aria-label="rst: input rst: u1">rst</span><span class="token-punct">:</span> <span class="token-type">bool</span>) <span class="token-punct">-&gt;</span> (<span class="token-ident" tabindex="0" data-code-info="output pixel: [30][40]u1" aria-label="pixel: output pixel: [30][40]u1">pixel</span><span class="token-punct">:</span> [<span class="token-number">30</span>][<span class="token-number">40</span>]<span class="token-type">bool</span>) {</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    <span class="token-keyword">for</span> <span class="token-ident" tabindex="0" data-code-info="row: Nat" aria-label="row: row: Nat">row</span> <span class="token-keyword">in</span> <span class="token-number">0</span><span class="token-punct">..</span><span class="token-punct">&lt;</span><span class="token-number">30</span> {</span></div><div class="code-line"><span class="ln">4</span><span class="lt">        <span class="token-keyword">for</span> <span class="token-ident" tabindex="0" data-code-info="col: Nat" aria-label="col: col: Nat">col</span> <span class="token-keyword">in</span> <span class="token-number">0</span><span class="token-punct">..</span><span class="token-punct">&lt;</span><span class="token-number">40</span> {</span></div><div class="code-line"><span class="ln">5</span><span class="lt">            <span class="token-ident" tabindex="0" data-code-info="output pixel: [30][40]u1" aria-label="pixel: output pixel: [30][40]u1">pixel</span>[<span class="token-ident" tabindex="0" data-code-info="row: Nat" aria-label="row: row: Nat">row</span>][<span class="token-ident" tabindex="0" data-code-info="col: Nat" aria-label="col: col: Nat">col</span>] <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="input rst: u1" aria-label="rst: input rst: u1">rst</span></span></div><div class="code-line"><span class="ln">6</span><span class="lt">        }</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    }</span></div><div class="code-line"><span class="ln">8</span><span class="lt">}</span></div></div>
    
    </section>
<p>The attribute selects the module it is attached to. A sole clock is inferred;
multiple clocks require an explicit <code>&quot;clock&quot;: &quot;name&quot;</code>. <code>reset: &quot;rst&quot;</code> asserts
that one-bit input for one cycle, then deasserts it. Use
<code>reset: { signal: &quot;rst&quot;, cycles: 2 }</code> when more reset cycles are needed.
Reset signals must actually initialize the design's registers: declaring a
reset sequence alone does not initialize unconnected registers.</p>
<p>For <code>[height][width]bool</code>, dimensions and monochrome mode come from the type.
The simulation lowering keeps each boolean row as a packed value, combines
its bit writes, and uses bit slices for reads. Registers and connections
execute on those packed rows. The host reads them directly as <code>Uint32Array</code>
words with <code>ceil(width / 32)</code> words per row; trailing bits are padding.
The worker transfers a matching validity mask instead of exporting one decimal
string per pixel, so an unknown bit affects only its corresponding pixel rather
than the entire packed row.</p>
<p>Other unsigned element types default to RGB integers (<code>0xRRGGBB</code>). Use
<code>display: { buffer: &quot;image&quot;, mode: &quot;gray&quot; }</code> for grayscale or set <code>on_color</code>
and <code>off_color</code> for monochrome colors. Mode never depends on the current
pixel values, so an initially black RGB image remains an RGB image.
The panel shows unknown values in magenta and reports an initialization hint.
Zoom is a canvas setting and does not change the circuit or framebuffer shape.</p>
<p><code>Noise.yodl</code> exposes an 80×60 logical RGB framebuffer with
<code>@simulation({ display: { buffer: &quot;pixel&quot; }, reset: &quot;rst&quot; })</code>. Each pixel consumes a
successive LFSR state in row-major order. One clock edge advances the seed by
one complete frame, so adjacent frames continue the sequence without
reusing overlapping samples. The example has no scan counters or VGA signals;
canvas zoom controls its displayed size.</p>
<p>Designs that already produce timed pixels can instead use a pixel stream:</p>
<pre><code class="language-text">@simulation({
    display: { stream: &quot;video&quot;, width: 640, height: 480 },
    reset: &quot;rst&quot;,
})
</code></pre>
<p>The <code>video</code> output is a named tuple with unsigned <code>x</code> and <code>y</code> coordinates,
a boolean <code>valid</code>, and unsigned <code>r</code>, <code>g</code>, and <code>b</code> channels of one to eight
bits. The host samples a valid pixel before each rising edge. A return to
valid coordinate <code>(0, 0)</code> marks the next frame; blanking cycles still execute
but do not paint pixels. Dimensions describe the active image, so blanking
and counter widths need not match them. Pixels not yet captured are shown in
magenta. The compiler resolves <code>x</code>, <code>y</code>, <code>valid</code>, and color channels through
the typed lowering table, so a source output such as <code>video_x</code> cannot collide
with the actual stream field binding.</p>
<p>The <strong>Simulate</strong> view of the output pane uses one persistent worker session for
Run, Pause, Resume, input edits, and manual steps. Changing an input settles
the circuit and refreshes the canvas. Reset creates a fresh machine from the
already compiled design. <strong>Restart simulation</strong> in Settings releases the session;
the next Run compiles a new one. Source edits also stop the session. Inputs and
outputs are listed above a waveform trace of the most recent samples, and
messages appear below it.</p>
<p>Source tabs load imported files and their dependencies automatically when you
open or edit a design, independently of automatic compilation. Imports open read-only, with their full path in
the editor header. The Main file remains the target for compilation, simulation,
drafts, and sharing while you browse. <strong>Download source</strong> in the <code>···</code> menu
downloads the file you are viewing.</p>
<p>Step advances one clock. For arrays, Step frame advances
<code>cycles_per_frame</code> (default one). Declare it only when a complete frame needs
multiple cycles; it must be a positive integer. For streams, Step frame runs
until the next frame boundary and reports the actual cycles advanced. Batch
capture completes the first stream frame before returning its first image.
Execution is divided into bounded chunks so Pause can interrupt a long frame
step; reaching the bounded budget without a frame boundary produces a specific
diagnostic.</p>
<p><code>clock_hz</code> sets the target simulation speed. Without it, clocked array and
scalar designs default to 30 cycles per second; pixel streams run as fast as
possible. The UI's <strong>Refresh FPS</strong> setting independently limits canvas updates
(default 30). It never sets the clock speed or the number of cycles advanced
by Step frame. The UI reports achieved cycles per second and simulated time
when a target frequency is configured. Resolved defaults appear in Settings.
Timing changes apply on Resume or the next manual step; top/clock changes
require a restart.</p>
<p>Capture length and canvas refresh are run options, not circuit annotations.
The batch API accepts <code>captureFrames</code> (default one) and optional
<code>cyclesPerFrame</code>; realtime playback accepts <code>refreshFps</code>. A clockless design
settles and displays its image without any timing configuration. For example,
ImageSim needs only <code>@simulation({ display: { buffer: &quot;pixel&quot; } })</code>.</p>
<p>Every framebuffer annotation uses the same <code>display</code> object. Logical arrays
need only <code>buffer</code>; colors and grayscale mode are optional fields in that
object. Designs that expose explicitly packed words use that same object with
<code>width</code>, <code>height</code>, and <code>packing</code>, for example:</p>
<pre><code class="language-text">display: {
    buffer: &quot;pixel&quot;,
    width: 400,
    height: 300,
    mode: &quot;binary&quot;,
    packing: &quot;bits32&quot;,
    on_color: 8116210,
    off_color: 1056800,
}
</code></pre>
<p><code>bits</code> and <code>bits32</code> store 8 and 32 horizontal monochrome pixels per word;
<code>rgb332x4</code> stores four RGB332 pixels per word. <code>pixel_scale</code> expands each
packed pixel into a square block when decoding. Prefer logical arrays for
new hardware: execution and transfer packing then remain internal.
Batch capture is available through the compiler API for deterministic tests
and snapshot generation. Normal settles use an incremental dependency
worklist; a deterministic full sweep is available as a reference oracle.
Known-address memory writes are grouped by word, while unknown addresses use
a separate conservative path instead of scanning memory for every ordinary
write.</p>
