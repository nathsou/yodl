<body><p><a href="../playground.html?mode=docs&chapter=09_external_modules">Open External Modules in the Yodl guide</a></p><noscript><article><h1 id="external-modules"><a class="heading-anchor" href="#external-modules">External Modules</a></h1>
<p>Yodl allows you to integrate existing Verilog modules into your designs through external module declarations. This is useful for leveraging existing IP, interfacing with vendor-specific primitives, or gradually migrating from Verilog to Yodl.</p>
<h2 id="external-module-declaration"><a class="heading-anchor" href="#external-module-declaration">External Module Declaration</a></h2>
<p>External modules are declared using the <code>@external</code> attribute followed by a module declaration:</p>
<section class="code-example" id="ex-external-module-declaration" aria-label="Example: external module declaration">
    <div class="example-header"><span class="example-file">ex-external-module-declaration.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: external module declaration"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-punct">@</span>external(<span class="token-string">&quot;module_name&quot;</span>, <span class="token-string">&quot;file.v&quot;</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-punct">@</span>parameters({ <span class="token-ident">PARAM1</span><span class="token-punct">:</span> <span class="token-number">0</span>, <span class="token-ident">PARAM2</span><span class="token-punct">:</span> <span class="token-string">&quot;true&quot;</span> })</span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">declare</span> <span class="token-keyword">module</span> <span class="token-ident" tabindex="0" data-code-info="module ExternalModule(input1: u8, input2: [4]u1) -&gt; (output1: u1, output2: u16)" aria-label="ExternalModule: module ExternalModule(input1: u8, input2: [4]u1) -&gt; (output1: u1, output2: u16)">ExternalModule</span>(</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="input input1: u8" aria-label="input1: input input1: u8">input1</span><span class="token-punct">:</span> <span class="token-type">u8</span>,</span></div><div class="code-line"><span class="ln">5</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="input input2: [4]u1" aria-label="input2: input input2: [4]u1">input2</span><span class="token-punct">:</span> [<span class="token-number">4</span>]<span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">6</span><span class="lt">) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="output output1: u1" aria-label="output1: output output1: u1">output1</span><span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">8</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="output output2: u16" aria-label="output2: output output2: u16">output2</span><span class="token-punct">:</span> <span class="token-type">u16</span>,</span></div><div class="code-line"><span class="ln">9</span><span class="lt">)</span></div></div>
    
    </section>
<h3 id="attributes"><a class="heading-anchor" href="#attributes">Attributes</a></h3>
<h4 id="externalmodule_name-file_path"><a class="heading-anchor" href="#externalmodule_name-file_path"><code>@external(module_name, file_path)</code></a></h4>
<ul>
<li><code>module_name</code>: The name of the Verilog module to instantiate</li>
<li><code>file_path</code>: Path to the Verilog file containing the module (relative to the generated FIRRTL output file)</li>
</ul>
<h4 id="parameters---optional"><a class="heading-anchor" href="#parameters---optional"><code>@parameters({ ... })</code> (Optional)</a></h4>
<p>Parameters to pass to the Verilog module. These become <code>parameter</code> declarations in the generated Verilog.</p>
</article></noscript></body></html>
