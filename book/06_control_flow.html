<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Control Flow · Yodl</title><meta name="description" content="Control Flow in Yodl. Learn the language with editable examples and inspect the hardware compiler output."><link rel="canonical" href="../playground.html?mode=docs&chapter=06_control_flow"><script>location.replace("../playground.html?mode=docs&chapter=06_control_flow"+location.hash)</script><style>body{font:16px/1.7 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px}pre{overflow:auto}</style></head>
<body><p><a href="../playground.html?mode=docs&chapter=06_control_flow">Open Control Flow in the Yodl guide</a></p><noscript><article><h1 id="control-flow"><a class="heading-anchor" href="#control-flow">Control Flow</a></h1>
<p>Yodl supports several control flow constructs that help express complex behaviours in digital circuits.</p>
<h2 id="conditional-statements"><a class="heading-anchor" href="#conditional-statements">Conditional Statements</a></h2>
<h3 id="if-expressions"><a class="heading-anchor" href="#if-expressions">If Expressions</a></h3>
<p>If expressions evaluate a condition and execute one of two branches based on the result:</p>
<section class="code-example" id="ex-if-expressions" aria-label="Example: if expressions">
    <div class="example-header"><span class="example-file">ex-if-expressions.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: if expressions"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> max <span class="token-punct">=</span> <span class="token-keyword">if</span> a <span class="token-punct">&gt;</span> b {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    a</span></div><div class="code-line"><span class="ln">3</span><span class="lt">} <span class="token-keyword">else</span> {</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    b</span></div><div class="code-line"><span class="ln">5</span><span class="lt">}</span></div></div>
    
    </section>
<p>If expressions always return a value. When used as statements (without assigning the result), the result is discarded.</p>
<h3 id="match-expressions"><a class="heading-anchor" href="#match-expressions">Match Expressions</a></h3>
<p>Match expressions provide a compact way of handling multiple conditions based on a single value:</p>
<section class="code-example" id="ex-match-expressions" aria-label="Example: match expressions">
    <div class="example-header"><span class="example-file">ex-match-expressions.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: match expressions"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-comment">// compute next state in the Game of Life</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt">alive<span class="token-punct">.</span>d <span class="token-punct">=</span> <span class="token-keyword">match</span> count {</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    <span class="token-number">3&#39;d2</span> <span class="token-punct">=&gt;</span> alive<span class="token-punct">.</span>q <span class="token-comment">// stable</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt">    <span class="token-number">3&#39;d3</span> <span class="token-punct">=&gt;</span> <span class="token-keyword">true</span> <span class="token-comment">// reproduction</span></span></div><div class="code-line"><span class="ln">5</span><span class="lt">    _ <span class="token-punct">=&gt;</span> <span class="token-keyword">false</span> <span class="token-comment">// overpopulation or underpopulation</span></span></div><div class="code-line"><span class="ln">6</span><span class="lt">}</span></div></div>
    
    </section>
<p>A match expression must handle all possible values of the match condition, either by explicitly listing all cases or by providing a default case with the <code>_</code> wildcard.</p>
<h2 id="iteration"><a class="heading-anchor" href="#iteration">Iteration</a></h2>
<h3 id="for-loops"><a class="heading-anchor" href="#for-loops">For Loops</a></h3>
<p>The <code>for</code> loop duplicates its body a fixed number of times, substituting the loop variable with the current iteration index.</p>
<section class="code-example" id="ex-for-loops" aria-label="Example: for loops">
    <div class="example-header"><span class="example-file">ex-for-loops.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: for loops"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-comment">// Simple parallel hexadecimal to character decoder</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Hex</span>[<span class="token-ident">Bits</span><span class="token-punct">:</span> <span class="token-type">Nat</span>](n<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-ident">Bits</span>]) <span class="token-punct">-&gt;</span> (chars<span class="token-punct">:</span> [<span class="token-function">cdiv!</span>(<span class="token-ident">Bits</span>, <span class="token-number">4</span>)]<span class="token-type">u8</span>) {</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    <span class="token-keyword">const</span> <span class="token-ident">Len</span> <span class="token-punct">=</span> <span class="token-function">cdiv!</span>(<span class="token-ident">Bits</span>, <span class="token-number">4</span>)</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    <span class="token-keyword">for</span> i <span class="token-keyword">in</span> <span class="token-number">0</span><span class="token-punct">..&lt;</span><span class="token-ident">Len</span> {</span></div><div class="code-line"><span class="ln">5</span><span class="lt">        chars[<span class="token-ident">Len</span> <span class="token-punct">-</span> <span class="token-number">1</span> <span class="token-punct">-</span> i] <span class="token-punct">=</span> <span class="token-keyword">match</span> n[(i <span class="token-punct">+</span> <span class="token-number">1</span>) <span class="token-punct">*</span> <span class="token-number">4</span> <span class="token-punct">-</span> <span class="token-number">1</span> <span class="token-punct">-:</span> <span class="token-number">4</span>] {</span></div><div class="code-line"><span class="ln">6</span><span class="lt">            <span class="token-number">4&#39;h0</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-number">0</span>&#39;</span></div><div class="code-line"><span class="ln">7</span><span class="lt">            <span class="token-number">4&#39;h1</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-number">1</span>&#39;</span></div><div class="code-line"><span class="ln">8</span><span class="lt">            <span class="token-number">4&#39;h2</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-number">2</span>&#39;</span></div><div class="code-line"><span class="ln">9</span><span class="lt">            <span class="token-number">4&#39;h3</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-number">3</span>&#39;</span></div><div class="code-line"><span class="ln">10</span><span class="lt">            <span class="token-number">4&#39;h4</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-number">4</span>&#39;</span></div><div class="code-line"><span class="ln">11</span><span class="lt">            <span class="token-number">4&#39;h5</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-number">5</span>&#39;</span></div><div class="code-line"><span class="ln">12</span><span class="lt">            <span class="token-number">4&#39;h6</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-number">6</span>&#39;</span></div><div class="code-line"><span class="ln">13</span><span class="lt">            <span class="token-number">4&#39;h7</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-number">7</span>&#39;</span></div><div class="code-line"><span class="ln">14</span><span class="lt">            <span class="token-number">4&#39;h8</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-number">8</span>&#39;</span></div><div class="code-line"><span class="ln">15</span><span class="lt">            <span class="token-number">4&#39;h9</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-number">9</span>&#39;</span></div><div class="code-line"><span class="ln">16</span><span class="lt">            <span class="token-number">4&#39;hA</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-ident">A</span>&#39;</span></div><div class="code-line"><span class="ln">17</span><span class="lt">            <span class="token-number">4&#39;hB</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-ident">B</span>&#39;</span></div><div class="code-line"><span class="ln">18</span><span class="lt">            <span class="token-number">4&#39;hC</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-ident">C</span>&#39;</span></div><div class="code-line"><span class="ln">19</span><span class="lt">            <span class="token-number">4&#39;hD</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-ident">D</span>&#39;</span></div><div class="code-line"><span class="ln">20</span><span class="lt">            <span class="token-number">4&#39;hE</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-ident">E</span>&#39;</span></div><div class="code-line"><span class="ln">21</span><span class="lt">            <span class="token-number">4&#39;hF</span> <span class="token-punct">=&gt;</span> &#39;<span class="token-ident">F</span>&#39;</span></div><div class="code-line"><span class="ln">22</span><span class="lt">        }</span></div><div class="code-line"><span class="ln">23</span><span class="lt">    }</span></div><div class="code-line"><span class="ln">24</span><span class="lt">}</span></div></div>
    
    </section>
<p>The range syntax uses:</p>
<ul>
<li><code>a..&lt;b</code> for exclusive upper bound (iterates from a to b-1)</li>
<li><code>a..=b</code> for inclusive upper bound (iterates from a to b)</li>
</ul>
<div class="warning">
    For loops are fully unrolled during compilation, so they must have compile-time constant bounds.
</div>
<h2 id="when-to-use-each-control-flow-construct"><a class="heading-anchor" href="#when-to-use-each-control-flow-construct">When to Use Each Control Flow Construct</a></h2>
<ul>
<li><strong>If Expressions</strong>: Use for simple binary decisions, especially when the logic is straightforward.</li>
<li><strong>Match Expressions</strong>: Use when you need to handle multiple distinct cases based on a single value.</li>
<li><strong>For Loops</strong>: Use to repeat operations a known number of times, especially when manipulating vectors or generating parallel hardware.</li>
</ul>
<h2 id="control-flow-in-hardware-context"><a class="heading-anchor" href="#control-flow-in-hardware-context">Control Flow in Hardware Context</a></h2>
<p>In hardware description languages, control flow constructs don't create sequential execution as in software, they describe hardware structures that implement the specified behavior. Yodl's compiler unrolls loops and elaborates conditional statements into multiplexers.</p>
<h2 id="explore-loop-expansion"><a class="heading-anchor" href="#explore-loop-expansion">Explore loop expansion</a></h2>
<p>This example is shared with the guided tour. Change <code>Lanes</code> from 4 to 8 and
compile the <strong>Simplified</strong> output to see the assignments generated for each
lane. Use <strong>Compare output with original</strong> to inspect the difference.</p>
<section class="code-example" id="ex-parallel-lanes" aria-label="Example: parallel lanes">
    <div class="example-header"><span class="example-file">ex-parallel-lanes.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: parallel lanes"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">const</span> <span class="token-ident">Lanes</span> <span class="token-punct">=</span> <span class="token-number">4</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"> </span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Top</span>(values<span class="token-punct">:</span> [<span class="token-ident">Lanes</span>]<span class="token-type">u8</span>, mask<span class="token-punct">:</span> <span class="token-type">u8</span>) <span class="token-punct">-&gt;</span> (result<span class="token-punct">:</span> [<span class="token-ident">Lanes</span>]<span class="token-type">u8</span>) {</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    <span class="token-keyword">for</span> i <span class="token-keyword">in</span> <span class="token-number">0</span><span class="token-punct">..&lt;</span><span class="token-ident">Lanes</span> {</span></div><div class="code-line"><span class="ln">5</span><span class="lt">        result[i] <span class="token-punct">=</span> values[i] <span class="token-keyword">xor</span> mask</span></div><div class="code-line"><span class="ln">6</span><span class="lt">    }</span></div><div class="code-line"><span class="ln">7</span><span class="lt">}</span></div></div>
    
    </section>
</article></noscript></body></html>
