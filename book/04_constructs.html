<ul>

n&gt;" aria-label="CYCLES_PER_BIT: const CYCLES_PER_BIT: u10">CYCLES_PER_BIT</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="const CLOCK_FREQ: u27" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;const&lt;/span&gt; &lt;span class=&quot;token-ident&quot;&gt;CLOCK_FREQ&lt;/span&gt;&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u27&lt;/span&gt;" aria-label="CLOCK_FREQ: const CLOCK_FREQ: u27">CLOCK_FREQ</span> <span class="token-punct">/</span> <span class="token-ident" tabindex="0" data-code-info="const BAUD_RATE: u17" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;const&lt;/span&gt; &lt;span class=&quot;token-ident&quot;&gt;BAUD_RATE&lt;/span&gt;&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u17&lt;/span&gt;" aria-label="BAUD_RATE: const BAUD_RATE: u17">BAUD_RATE</span></span></div></div>

<p>Type aliases can be parameterised by providing a list of type parameters.</p>

<h2 id="module-declarations"><a class="heading-anchor" href="#module-declarations">Module Declarations</a></h2>
<ul>
<li>
<p>Modules enable hierarchical design by encapsulating reusable functionality.</p>
</li>
<li>
<p>A module is defined by a name, an optional list of parameters, and a list of input and output ports.</p>
</li>
</ul>
<section class="code-example" id="ex-module-declarations" aria-label="Example: module declarations">

<h3 id="module-instances"><a class="heading-anchor" href="#module-instances">Module instances</a></h3>
<ul>
<li>
<p>Module instances are first-class values that can be assigned to variables.</p>
</li>
<li>
<p>If a module is parameterised, all the parameters must be specified when creating an instance.</p>
</li>
<li>
<p>Parameter names can be omitted if the parameters are specified in the same order as the declaration.</p>
</li>
</ul>

<ul>
<li>
<p>A module instance need not assign all ports as the module's ports are accessible as fields of the instance using the <code>.</code> operator.</p>
</li>
<li>
<p>Ports whose values are local variables with the same name can omit the right-hand side of the assignment.</p>
</li>
</ul>
<p>All three <code>Reg</code> instances in the following example are equivalent.</p>

<h2 id="let-bindings"><a class="heading-anchor" href="#let-bindings">Let Bindings</a></h2>
<ul>
<li>A let binding introduces a named value in the current scope.</li>
<li>Let bindings must be defined inside a module declaration.</li>
<li>The type of the binding is inferred from the right-hand side of the assignment if present
otherwise, the type must be explicitly specified.</li>
</ul>
