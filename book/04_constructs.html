<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Language Constructs · Yodl</title><meta name="description" content="Language Constructs in Yodl. Learn the language with editable examples and inspect the hardware compiler output."><link rel="canonical" href="../playground.html?mode=docs&chapter=04_constructs"><script>location.replace("../playground.html?mode=docs&chapter=04_constructs"+location.hash)</script><style>body{font:16px/1.7 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px}pre{overflow:auto}</style></head>
<body><p><a href="../playground.html?mode=docs&chapter=04_constructs">Open Language Constructs in the Yodl guide</a></p><noscript><article><h1 id="language-constructs"><a class="heading-anchor" href="#language-constructs">Language Constructs</a></h1>
<h2 id="packages"><a class="heading-anchor" href="#packages">Packages</a></h2>
<p>Packages group related top-level declarations under a common namespace.</p>
<section class="code-example" id="ex-packages" aria-label="Example: packages">
    <div class="example-header"><span class="example-file">ex-packages.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: packages"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">package</span> <span class="token-ident">VGA</span> {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-keyword">const</span> <span class="token-ident">SCREEN_WIDTH</span> <span class="token-punct">=</span> <span class="token-number">640</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt">    <span class="token-keyword">const</span> <span class="token-ident">SCREEN_HEIGHT</span> <span class="token-punct">=</span> <span class="token-number">480</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt"> </span></div><div class="code-line"><span class="ln">5</span><span class="lt">    <span class="token-keyword">module</span> <span class="token-ident">SyncPulses</span>(</span></div><div class="code-line"><span class="ln">6</span><span class="lt">        clk<span class="token-punct">:</span> <span class="token-type">clock</span>,</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    ) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">8</span><span class="lt">        hsync<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">9</span><span class="lt">        vsync<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">10</span><span class="lt">        row<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-function">clog2!</span>(<span class="token-ident">SCREEN_HEIGHT</span>)],</span></div><div class="code-line"><span class="ln">11</span><span class="lt">        col<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-function">clog2!</span>(<span class="token-ident">SCREEN_WIDTH</span>)],</span></div><div class="code-line"><span class="ln">12</span><span class="lt">    ) {</span></div><div class="code-line"><span class="ln">13</span><span class="lt">        <span class="token-comment">// ...</span></span></div><div class="code-line"><span class="ln">14</span><span class="lt">    }</span></div><div class="code-line"><span class="ln">15</span><span class="lt">}</span></div><div class="code-line"><span class="ln">16</span><span class="lt"> </span></div><div class="code-line"><span class="ln">17</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Top</span>(</span></div><div class="code-line"><span class="ln">18</span><span class="lt">    clk<span class="token-punct">:</span> <span class="token-type">clock</span>,</span></div><div class="code-line"><span class="ln">19</span><span class="lt">) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">20</span><span class="lt">    hsync<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">21</span><span class="lt">    vsync<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">22</span><span class="lt">    vga_color<span class="token-punct">:</span> (r<span class="token-punct">:</span> <span class="token-type">u8</span>, g<span class="token-punct">:</span> <span class="token-type">u8</span>, b<span class="token-punct">:</span> <span class="token-type">u8</span>),</span></div><div class="code-line"><span class="ln">23</span><span class="lt">) {</span></div><div class="code-line"><span class="ln">24</span><span class="lt">    <span class="token-keyword">let</span> pulses <span class="token-punct">=</span> <span class="token-ident">VGA</span><span class="token-punct">::</span><span class="token-ident">SyncPulses</span>(clk, hsync, vsync)</span></div><div class="code-line"><span class="ln">25</span><span class="lt">    vga_color <span class="token-punct">=</span> (</span></div><div class="code-line"><span class="ln">26</span><span class="lt">        r<span class="token-punct">:</span> pulses<span class="token-punct">.</span>row[<span class="token-number">7</span><span class="token-punct">:</span><span class="token-number">0</span>],</span></div><div class="code-line"><span class="ln">27</span><span class="lt">        g<span class="token-punct">:</span> pulses<span class="token-punct">.</span>col[<span class="token-number">7</span><span class="token-punct">:</span><span class="token-number">0</span>],</span></div><div class="code-line"><span class="ln">28</span><span class="lt">        b<span class="token-punct">:</span> <span class="token-number">8&#39;d127</span>,</span></div><div class="code-line"><span class="ln">29</span><span class="lt">    )</span></div><div class="code-line"><span class="ln">30</span><span class="lt">}</span></div></div>
    
    </section>
<ul>
<li>
<p>Members declared within a package are accessed using the <code>::</code> operator.</p>
</li>
<li>
<p>Imported files are implicitly wrapped in a package with the same name as the file.</p>
</li>
</ul>
<h2 id="constant-declarations"><a class="heading-anchor" href="#constant-declarations">Constant Declarations</a></h2>
<p>Constants are named fixed values known at compile-time.</p>
<section class="code-example" id="ex-constant-declarations" aria-label="Example: constant declarations">
    <div class="example-header"><span class="example-file">ex-constant-declarations.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: constant declarations"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">const</span> <span class="token-ident">BAUD_RATE</span> <span class="token-punct">=</span> <span class="token-number">115200</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">const</span> <span class="token-ident">CLOCK_FREQ</span> <span class="token-punct">=</span> <span class="token-number">100</span> <span class="token-punct">*</span> 1_000_000 <span class="token-comment">// 100 MHz</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">const</span> <span class="token-ident">CYCLES_PER_BIT</span> <span class="token-punct">=</span> <span class="token-ident">CLOCK_FREQ</span> <span class="token-punct">/</span> <span class="token-ident">BAUD_RATE</span></span></div></div>
    
    </section>
<h2 id="type-alias-declarations"><a class="heading-anchor" href="#type-alias-declarations">Type Alias Declarations</a></h2>
<p>Type aliases are used to give a name to a commonly used type.</p>
<section class="code-example" id="ex-type-alias-declarations" aria-label="Example: type alias declarations">
    <div class="example-header"><span class="example-file">ex-type-alias-declarations.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: type alias declarations"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">type</span> <span class="token-ident">U8</span> <span class="token-punct">=</span> <span class="token-type">u8</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">type</span> <span class="token-ident">RGB</span> <span class="token-punct">=</span> (r<span class="token-punct">:</span> <span class="token-ident">U8</span>, g<span class="token-punct">:</span> <span class="token-ident">U8</span>, b<span class="token-punct">:</span> <span class="token-ident">U8</span>)</span></div></div>
    
    </section>
<h3 id="parameterised-type-aliases"><a class="heading-anchor" href="#parameterised-type-aliases">Parameterised type aliases</a></h3>
<p>Type aliases can be parameterised by providing a list of type parameters.</p>
<section class="code-example" id="ex-parameterised-type-aliases" aria-label="Example: parameterised type aliases">
    <div class="example-header"><span class="example-file">ex-parameterised-type-aliases.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: parameterised type aliases"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">type</span> <span class="token-ident">Triplet</span>[<span class="token-ident">T</span>] <span class="token-punct">=</span> (<span class="token-ident">T</span>, <span class="token-ident">T</span>, <span class="token-ident">T</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"> </span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Top</span>() <span class="token-punct">-&gt;</span> () {</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    <span class="token-keyword">let</span> triplet<span class="token-punct">:</span> <span class="token-ident">Triplet</span>[<span class="token-type">bool</span>] <span class="token-punct">=</span> (<span class="token-keyword">true</span>, <span class="token-keyword">false</span>, <span class="token-keyword">false</span>)</span></div><div class="code-line"><span class="ln">5</span><span class="lt">}</span></div></div>
    
    </section>
<h2 id="module-declarations"><a class="heading-anchor" href="#module-declarations">Module Declarations</a></h2>
<ul>
<li>
<p>Modules enable hierarchical design by encapsulating reusable functionality.</p>
</li>
<li>
<p>A module is defined by a name, an optional list of parameters, and a list of input and output ports.</p>
</li>
</ul>
<section class="code-example" id="ex-module-declarations" aria-label="Example: module declarations">
    <div class="example-header"><span class="example-file">ex-module-declarations.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: module declarations"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">FullAdder</span>(</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    a<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    b<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    carry_in<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">5</span><span class="lt">) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">6</span><span class="lt">    sum<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    carry_out<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">8</span><span class="lt">) {</span></div><div class="code-line"><span class="ln">9</span><span class="lt">    <span class="token-keyword">let</span> xor1 <span class="token-punct">=</span> a <span class="token-keyword">xor</span> b</span></div><div class="code-line"><span class="ln">10</span><span class="lt">    sum <span class="token-punct">=</span> carry_in <span class="token-keyword">xor</span> xor1</span></div><div class="code-line"><span class="ln">11</span><span class="lt">    carry_out <span class="token-punct">=</span> (carry_in <span class="token-keyword">and</span> xor1) <span class="token-keyword">or</span> (a <span class="token-keyword">and</span> b)</span></div><div class="code-line"><span class="ln">12</span><span class="lt">}</span></div></div>
    
    </section>
<h3 id="parameterised-modules"><a class="heading-anchor" href="#parameterised-modules">Parameterised Modules</a></h3>
<p>Modules can be parameterised by specifying a list of parameters surrounded by <code>[</code> and <code>]</code> after the module name.</p>
<section class="code-example" id="ex-parameterised-modules" aria-label="Example: parameterised modules">
    <div class="example-header"><span class="example-file">ex-parameterised-modules.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: parameterised modules"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Adder</span>[<span class="token-ident">N</span><span class="token-punct">:</span> <span class="token-type">Nat</span>](</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    a<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-ident">N</span>],</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    b<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-ident">N</span>],</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    carry_in<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">5</span><span class="lt">) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">6</span><span class="lt">    sum<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-ident">N</span>],</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    carry_out<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">8</span><span class="lt">) {</span></div><div class="code-line"><span class="ln">9</span><span class="lt">    <span class="token-keyword">let</span> carry_chain<span class="token-punct">:</span> [<span class="token-ident">N</span> <span class="token-punct">+</span> <span class="token-number">1</span>]<span class="token-type">bool</span></span></div><div class="code-line"><span class="ln">10</span><span class="lt">    carry_chain[<span class="token-number">0</span>] <span class="token-punct">=</span> carry_in</span></div><div class="code-line"><span class="ln">11</span><span class="lt">    <span class="token-keyword">let</span> bits<span class="token-punct">:</span> [<span class="token-ident">N</span>]<span class="token-type">bool</span></span></div><div class="code-line"><span class="ln">12</span><span class="lt"> </span></div><div class="code-line"><span class="ln">13</span><span class="lt">    <span class="token-keyword">for</span> i <span class="token-keyword">in</span> <span class="token-number">0</span><span class="token-punct">..&lt;</span><span class="token-ident">N</span> {</span></div><div class="code-line"><span class="ln">14</span><span class="lt">        <span class="token-ident">FullAdder</span>(</span></div><div class="code-line"><span class="ln">15</span><span class="lt">            a<span class="token-punct">:</span> a[i],</span></div><div class="code-line"><span class="ln">16</span><span class="lt">            b<span class="token-punct">:</span> b[i],</span></div><div class="code-line"><span class="ln">17</span><span class="lt">            carry_in<span class="token-punct">:</span> carry_chain[i],</span></div><div class="code-line"><span class="ln">18</span><span class="lt">            carry_out<span class="token-punct">:</span> carry_chain[i <span class="token-punct">+</span> <span class="token-number">1</span>],</span></div><div class="code-line"><span class="ln">19</span><span class="lt">            sum<span class="token-punct">:</span> bits[i],</span></div><div class="code-line"><span class="ln">20</span><span class="lt">        )</span></div><div class="code-line"><span class="ln">21</span><span class="lt">    }</span></div><div class="code-line"><span class="ln">22</span><span class="lt"> </span></div><div class="code-line"><span class="ln">23</span><span class="lt">    carry_out <span class="token-punct">=</span> carry_chain[<span class="token-ident">N</span>]</span></div><div class="code-line"><span class="ln">24</span><span class="lt">    sum <span class="token-punct">=</span> <span class="token-function">uint!</span>(bits)</span></div><div class="code-line"><span class="ln">25</span><span class="lt">}</span></div></div>
    
    </section>
<h3 id="module-instances"><a class="heading-anchor" href="#module-instances">Module instances</a></h3>
<ul>
<li>
<p>Module instances are first-class values that can be assigned to variables.</p>
</li>
<li>
<p>If a module is parameterised, all the parameters must be specified when creating an instance.</p>
</li>
<li>
<p>Parameter names can be omitted if the parameters are specified in the same order as the declaration.</p>
</li>
</ul>
<section class="code-example" id="ex-module-instances" aria-label="Example: module instances">
    <div class="example-header"><span class="example-file">ex-module-instances.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: module instances"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Adder</span>[<span class="token-ident">N</span><span class="token-punct">:</span> <span class="token-type">Nat</span>](</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    a<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-ident">N</span>],</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    b<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-ident">N</span>],</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    carry_in<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">5</span><span class="lt">) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">6</span><span class="lt">    sum<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-ident">N</span>],</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    carry_out<span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">8</span><span class="lt">) {</span></div><div class="code-line"><span class="ln">9</span><span class="lt">    <span class="token-keyword">let</span> total<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-ident">N</span> <span class="token-punct">+</span> <span class="token-number">1</span>] <span class="token-punct">=</span> a <span class="token-punct">+</span> b <span class="token-punct">+</span> carry_in</span></div><div class="code-line"><span class="ln">10</span><span class="lt">    sum <span class="token-punct">=</span> total[<span class="token-ident">N</span> <span class="token-punct">-</span> <span class="token-number">1</span> <span class="token-punct">:</span> <span class="token-number">0</span>]</span></div><div class="code-line"><span class="ln">11</span><span class="lt">    carry_out <span class="token-punct">=</span> total[<span class="token-ident">N</span>]</span></div><div class="code-line"><span class="ln">12</span><span class="lt">}</span></div><div class="code-line"><span class="ln">13</span><span class="lt"> </span></div><div class="code-line"><span class="ln">14</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Top</span>(clk<span class="token-punct">:</span> <span class="token-type">clock</span>) <span class="token-punct">-&gt;</span> () {</span></div><div class="code-line"><span class="ln">15</span><span class="lt">    <span class="token-keyword">let</span> counter <span class="token-punct">=</span> <span class="token-ident">Reg</span>[<span class="token-type">u32</span>](clk)</span></div><div class="code-line"><span class="ln">16</span><span class="lt">    counter<span class="token-punct">.</span>d <span class="token-punct">=</span> counter<span class="token-punct">.</span>q <span class="token-punct">+</span> <span class="token-number">1</span></span></div><div class="code-line"><span class="ln">17</span><span class="lt"> </span></div><div class="code-line"><span class="ln">18</span><span class="lt">    <span class="token-keyword">let</span> adder <span class="token-punct">=</span> <span class="token-ident">Adder</span>[<span class="token-number">32</span>]( <span class="token-comment">// or Adder[N: 32](..)</span></span></div><div class="code-line"><span class="ln">19</span><span class="lt">        a<span class="token-punct">:</span> counter<span class="token-punct">.</span>q,</span></div><div class="code-line"><span class="ln">20</span><span class="lt">        b<span class="token-punct">:</span> <span class="token-number">32&#39;1</span>,</span></div><div class="code-line"><span class="ln">21</span><span class="lt">        carry_in<span class="token-punct">:</span> <span class="token-number">1&#39;0</span>,</span></div><div class="code-line"><span class="ln">22</span><span class="lt">    )</span></div><div class="code-line"><span class="ln">23</span><span class="lt">}</span></div></div>
    
    </section>
<ul>
<li>
<p>A module instance need not assign all ports as the module's ports are accessible as fields of the instance using the <code>.</code> operator.</p>
</li>
<li>
<p>Ports whose values are local variables with the same name can omit the right-hand side of the assignment.</p>
</li>
</ul>
<p>All three <code>Reg</code> instances in the following example are equivalent.</p>
<section class="code-example" id="ex-module-instances-2" aria-label="Example: module instances 2">
    <div class="example-header"><span class="example-file">ex-module-instances-2.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: module instances 2"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident">Top</span>(clk<span class="token-punct">:</span> <span class="token-type">clock</span>, rst<span class="token-punct">:</span> <span class="token-type">bool</span>) <span class="token-punct">-&gt;</span> () {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-keyword">let</span> reg1 <span class="token-punct">=</span> <span class="token-ident">Reg</span>[<span class="token-type">u32</span>](clk<span class="token-punct">:</span> clk, rst<span class="token-punct">:</span> rst)</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    <span class="token-keyword">let</span> reg2 <span class="token-punct">=</span> <span class="token-ident">Reg</span>[<span class="token-type">u32</span>](clk, rst)</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    <span class="token-keyword">let</span> reg3 <span class="token-punct">=</span> <span class="token-ident">Reg</span>[<span class="token-type">u32</span>]()</span></div><div class="code-line"><span class="ln">5</span><span class="lt"> </span></div><div class="code-line"><span class="ln">6</span><span class="lt">    reg3<span class="token-punct">.</span>clk <span class="token-punct">=</span> clk</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    reg3<span class="token-punct">.</span>rst <span class="token-punct">=</span> rst</span></div><div class="code-line"><span class="ln">8</span><span class="lt">}</span></div></div>
    
    </section>
<h2 id="let-bindings"><a class="heading-anchor" href="#let-bindings">Let Bindings</a></h2>
<ul>
<li>A let binding introduces a named value in the current scope.</li>
<li>Let bindings must be defined inside a module declaration.</li>
<li>The type of the binding is inferred from the right-hand side of the assignment if present
otherwise, the type must be explicitly specified.</li>
</ul>
<section class="code-example" id="ex-let-bindings" aria-label="Example: let bindings">
    <div class="example-header"><span class="example-file">ex-let-bindings.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: let bindings"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> message1<span class="token-punct">:</span> [<span class="token-number">3</span>]<span class="token-type">u8</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt">message1 <span class="token-punct">=</span> <span class="token-string">&quot;Yo!&quot;</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">let</span> message2 <span class="token-punct">=</span> <span class="token-string">&quot;Hi!&quot;</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-keyword">let</span> message3<span class="token-punct">:</span> [<span class="token-number">3</span>]<span class="token-type">u8</span> <span class="token-punct">=</span> <span class="token-string">&quot;Hey&quot;</span></span></div></div>
    
    </section>
<h2 id="assignments"><a class="heading-anchor" href="#assignments">Assignments</a></h2>
<p>If a binding is assigned multiple times, only the last assignment is used.</p>
<section class="code-example" id="ex-assignments" aria-label="Example: assignments">
    <div class="example-header"><span class="example-file">ex-assignments.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: assignments"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> a <span class="token-punct">=</span> <span class="token-keyword">true</span> <span class="token-comment">// this first assignment is ignored</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt">a <span class="token-punct">=</span> <span class="token-keyword">false</span></span></div></div>
    
    </section>
<h2 id="block-expressions"><a class="heading-anchor" href="#block-expressions">Block Expressions</a></h2>
<p>Block expressions group multiple statements in a new lexical scope and optionally return a value:</p>
<section class="code-example" id="ex-block-expressions" aria-label="Example: block expressions">
    <div class="example-header"><span class="example-file">ex-block-expressions.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: block expressions"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> result <span class="token-punct">=</span> {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-keyword">let</span> a <span class="token-punct">=</span> <span class="token-number">5</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt">    <span class="token-keyword">let</span> b <span class="token-punct">=</span> <span class="token-number">10</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt">    a <span class="token-punct">+</span> b  <span class="token-comment">// Last expression becomes the block&#39;s value</span></span></div><div class="code-line"><span class="ln">5</span><span class="lt">}</span></div><div class="code-line"><span class="ln">6</span><span class="lt"> </span></div><div class="code-line"><span class="ln">7</span><span class="lt"><span class="token-function">assert!</span>(result <span class="token-punct">==</span> <span class="token-number">15</span>)</span></div></div>
    
    </section>
