<h2 id="packages"><a class="heading-anchor" href="#packages">Packages</a></h2>
<p>Packages group related top-level declarations under a common namespace.</p>
<section class="code-example" id="ex-packages" aria-label="Example: packages">
    <div class="example-header"><span class="example-file">ex-packages.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: packages"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">package</span> <span class="token-ident" tabindex="0" data-code-info="package VGA" aria-label="VGA: package VGA">VGA</span> {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-keyword">const</span> <span class="token-ident" tabindex="0" data-code-info="const SCREEN_WIDTH: u10" aria-label="SCREEN_WIDTH: const SCREEN_WIDTH: u10">SCREEN_WIDTH</span> <span class="token-punct">=</span> <span class="token-number" tabindex="0" data-code-info="u10" aria-label="640: u10">640</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt">    <span class="token-keyword">const</span> <span class="token-ident" tabindex="0" data-code-info="const SCREEN_HEIGHT: u9" aria-label="SCREEN_HEIGHT: const SCREEN_HEIGHT: u9">SCREEN_HEIGHT</span> <span class="token-punct">=</span> <span class="token-number" tabindex="0" data-code-info="u9" aria-label="480: u9">480</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt"> </span></div><div class="code-line"><span class="ln">5</span><span class="lt">    <span class="token-keyword">module</span> <span class="token-ident" tabindex="0" data-code-info="module SyncPulses(clk: clock) -&gt; (hsync: u1, vsync: u1, row: uint&lt;clog2!(SCREEN_HEIGHT)&gt;, col: uint&lt;clog2!(SCREEN_WIDTH)&gt;)" aria-label="SyncPulses: module SyncPulses(clk: clock) -&gt; (hsync: u1, vsync: u1, row: uint&lt;clog2!(SCREEN_HEIGHT)&gt;, col: uint&lt;clog2!(SCREEN_WIDTH)&gt;)">SyncPulses</span>(</span></div><div class="code-line"><span class="ln">6</span><span class="lt">        <span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span><span class="token-punct">:</span> <span class="token-type">clock</span>,</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    ) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">8</span><span class="lt">        <span class="token-ident" tabindex="0" data-code-info="output hsync: u1" aria-label="hsync: output hsync: u1">hsync</span><span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">9</span><span class="lt">        <span class="token-ident" tabindex="0" data-code-info="output vsync: u1" aria-label="vsync: output vsync: u1">vsync</span><span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">10</span><span class="lt">        <span class="token-ident" tabindex="0" data-code-info="output row: uint&lt;clog2!(SCREEN_HEIGHT)&gt;" aria-label="row: output row: uint&lt;clog2!(SCREEN_HEIGHT)&gt;">row</span><span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-function" tabindex="0" data-code-info="clog2!(value: Nat) -&gt; Nat" aria-label="clog2!: clog2!(value: Nat) -&gt; Nat">clog2!</span>(<span class="token-ident" tabindex="0" data-code-info="const SCREEN_HEIGHT: u9" aria-label="SCREEN_HEIGHT: const SCREEN_HEIGHT: u9">SCREEN_HEIGHT</span>)],</span></div><div class="code-line"><span class="ln">11</span><span class="lt">        <span class="token-ident" tabindex="0" data-code-info="output col: uint&lt;clog2!(SCREEN_WIDTH)&gt;" aria-label="col: output col: uint&lt;clog2!(SCREEN_WIDTH)&gt;">col</span><span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-function" tabindex="0" data-code-info="clog2!(value: Nat) -&gt; Nat" aria-label="clog2!: clog2!(value: Nat) -&gt; Nat">clog2!</span>(<span class="token-ident" tabindex="0" data-code-info="const SCREEN_WIDTH: u10" aria-label="SCREEN_WIDTH: const SCREEN_WIDTH: u10">SCREEN_WIDTH</span>)],</span></div><div class="code-line"><span class="ln">12</span><span class="lt">    ) {</span></div><div class="code-line"><span class="ln">13</span><span class="lt">        <span class="token-comment">// ...</span></span></div><div class="code-line"><span class="ln">14</span><span class="lt">    }</span></div><div class="code-line"><span class="ln">15</span><span class="lt">}</span></div><div class="code-line"><span class="ln">16</span><span class="lt"> </span></div><div class="code-line"><span class="ln">17</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident" tabindex="0" data-code-info="module Top(clk: clock) -&gt; (hsync: u1, vsync: u1, vga_color: (r: u8, g: u8, b: u8))" aria-label="Top: module Top(clk: clock) -&gt; (hsync: u1, vsync: u1, vga_color: (r: u8, g: u8, b: u8))">Top</span>(</span></div><div class="code-line"><span class="ln">18</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span><span class="token-punct">:</span> <span class="token-type">clock</span>,</span></div><div class="code-line"><span class="ln">19</span><span class="lt">) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">20</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="output hsync: u1" aria-label="hsync: output hsync: u1">hsync</span><span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">21</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="output vsync: u1" aria-label="vsync: output vsync: u1">vsync</span><span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">22</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="output vga_color: (r: u8, g: u8, b: u8)" aria-label="vga_color: output vga_color: (r: u8, g: u8, b: u8)">vga_color</span><span class="token-punct">:</span> (<span class="token-ident" tabindex="0" data-code-info="r: u8" aria-label="r: r: u8">r</span><span class="token-punct">:</span> <span class="token-type">u8</span>, <span class="token-ident" tabindex="0" data-code-info="g: u8" aria-label="g: g: u8">g</span><span class="token-punct">:</span> <span class="token-type">u8</span>, <span class="token-ident" tabindex="0" data-code-info="b: u8" aria-label="b: b: u8">b</span><span class="token-punct">:</span> <span class="token-type">u8</span>),</span></div><div class="code-line"><span class="ln">23</span><span class="lt">) {</span></div><div class="code-line"><span class="ln">24</span><span class="lt">    <span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let pulses: VGA::SyncPulses" aria-label="pulses: let pulses: VGA::SyncPulses">pulses</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="package VGA" aria-label="VGA: package VGA">VGA</span><span class="token-punct">::</span><span class="token-ident" tabindex="0" data-code-info="module SyncPulses(clk: clock) -&gt; (hsync: u1, vsync: u1, row: uint&lt;clog2!(SCREEN_HEIGHT)&gt;, col: uint&lt;clog2!(SCREEN_WIDTH)&gt;)" aria-label="SyncPulses: module SyncPulses(clk: clock) -&gt; (hsync: u1, vsync: u1, row: uint&lt;clog2!(SCREEN_HEIGHT)&gt;, col: uint&lt;clog2!(SCREEN_WIDTH)&gt;)">SyncPulses</span>(<span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span>, <span class="token-ident" tabindex="0" data-code-info="output hsync: u1" aria-label="hsync: output hsync: u1">hsync</span>, <span class="token-ident" tabindex="0" data-code-info="output vsync: u1" aria-label="vsync: output vsync: u1">vsync</span>)</span></div><div class="code-line"><span class="ln">25</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="output vga_color: (r: u8, g: u8, b: u8)" aria-label="vga_color: output vga_color: (r: u8, g: u8, b: u8)">vga_color</span> <span class="token-punct">=</span> (</span></div><div class="code-line"><span class="ln">26</span><span class="lt">        r<span class="token-punct">:</span> <span class="token-ident" tabindex="0" data-code-info="let pulses: VGA::SyncPulses" aria-label="pulses: let pulses: VGA::SyncPulses">pulses</span><span class="token-punct">.</span><span class="token-ident" tabindex="0" data-code-info="output row: uint&lt;clog2!(SCREEN_HEIGHT)&gt;" aria-label="row: output row: uint&lt;clog2!(SCREEN_HEIGHT)&gt;">row</span>[<span class="token-number" tabindex="0" data-code-info="u3" aria-label="7: u3">7</span><span class="token-punct">:</span><span class="token-number" tabindex="0" data-code-info="u1" aria-label="0: u1">0</span>],</span></div><div class="code-line"><span class="ln">27</span><span class="lt">        g<span class="token-punct">:</span> <span class="token-ident" tabindex="0" data-code-info="let pulses: VGA::SyncPulses" aria-label="pulses: let pulses: VGA::SyncPulses">pulses</span><span class="token-punct">.</span><span class="token-ident" tabindex="0" data-code-info="output col: uint&lt;clog2!(SCREEN_WIDTH)&gt;" aria-label="col: output col: uint&lt;clog2!(SCREEN_WIDTH)&gt;">col</span>[<span class="token-number" tabindex="0" data-code-info="u3" aria-label="7: u3">7</span><span class="token-punct">:</span><span class="token-number" tabindex="0" data-code-info="u1" aria-label="0: u1">0</span>],</span></div><div class="code-line"><span class="ln">28</span><span class="lt">        b<span class="token-punct">:</span> <span class="token-number" tabindex="0" data-code-info="u8" aria-label="8&#39;d127: u8">8&#39;d127</span>,</span></div><div class="code-line"><span class="ln">29</span><span class="lt">    )</span></div><div class="code-line"><span class="ln">30</span><span class="lt">}</span></div></div>
    
    </section>
<ul>
<li>
<p>Members declared within a package are accessed using the <code>::</code> operator.</p>
</li>
<li>
<p>Imported files are implicitly wrapped in a package with the same name as the file.</p>
</li>
</ul>
<h2 id="constant-declarations"><a class="heading-anchor" href="#constant-declarations">Constant Declarations</a></h2>
<p>Constants are named fixed values known at compile-time.</p>
<section class="code-example" id="ex-constant-declarations" aria-label="Example: constant declarations">
    <div class="example-header"><span class="example-file">ex-constant-declarations.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: constant declarations"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">const</span> <span class="token-ident" tabindex="0" data-code-info="const BAUD_RATE: u17" aria-label="BAUD_RATE: const BAUD_RATE: u17">BAUD_RATE</span> <span class="token-punct">=</span> <span class="token-number" tabindex="0" data-code-info="u17" aria-label="115200: u17">115200</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">const</span> <span class="token-ident" tabindex="0" data-code-info="const CLOCK_FREQ: u27" aria-label="CLOCK_FREQ: const CLOCK_FREQ: u27">CLOCK_FREQ</span> <span class="token-punct">=</span> <span class="token-number">100</span> <span class="token-punct">*</span> <span class="token-number">1_000_000</span> <span class="token-comment">// 100 MHz</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">const</span> <span class="token-ident" tabindex="0" data-code-info="const CYCLES_PER_BIT: u10" aria-label="CYCLES_PER_BIT: const CYCLES_PER_BIT: u10">CYCLES_PER_BIT</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="const CLOCK_FREQ: u27" aria-label="CLOCK_FREQ: const CLOCK_FREQ: u27">CLOCK_FREQ</span> <span class="token-punct">/</span> <span class="token-ident" tabindex="0" data-code-info="const BAUD_RATE: u17" aria-label="BAUD_RATE: const BAUD_RATE: u17">BAUD_RATE</span></span></div></div>
    
    </section>
<h2 id="type-alias-declarations"><a class="heading-anchor" href="#type-alias-declarations">Type Alias Declarations</a></h2>
<p>Type aliases are used to give a name to a commonly used type.</p>
<section class="code-example" id="ex-type-alias-declarations" aria-label="Example: type alias declarations">
    <div class="example-header"><span class="example-file">ex-type-alias-declarations.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: type alias declarations"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">type</span> <span class="token-type" tabindex="0" data-code-info="type U8 = u8" aria-label="U8: type U8 = u8">U8</span> <span class="token-punct">=</span> <span class="token-type">u8</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">type</span> <span class="token-type" tabindex="0" data-code-info="type RGB = (r: U8, g: U8, b: U8)" aria-label="RGB: type RGB = (r: U8, g: U8, b: U8)">RGB</span> <span class="token-punct">=</span> (<span class="token-ident" tabindex="0" data-code-info="r: U8" aria-label="r: r: U8">r</span><span class="token-punct">:</span> <span class="token-type" tabindex="0" data-code-info="type U8 = u8" aria-label="U8: type U8 = u8">U8</span>, <span class="token-ident" tabindex="0" data-code-info="g: U8" aria-label="g: g: U8">g</span><span class="token-punct">:</span> <span class="token-type" tabindex="0" data-code-info="type U8 = u8" aria-label="U8: type U8 = u8">U8</span>, <span class="token-ident" tabindex="0" data-code-info="b: U8" aria-label="b: b: U8">b</span><span class="token-punct">:</span> <span class="token-type" tabindex="0" data-code-info="type U8 = u8" aria-label="U8: type U8 = u8">U8</span>)</span></div></div>
    
    </section>
<h3 id="parameterised-type-aliases"><a class="heading-anchor" href="#parameterised-type-aliases">Parameterised type aliases</a></h3>
<p>Type aliases can be parameterised by providing a list of type parameters.</p>
<section class="code-example" id="ex-parameterised-type-aliases" aria-label="Example: parameterised type aliases">
    <div class="example-header"><span class="example-file">ex-parameterised-type-aliases.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: parameterised type aliases"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">type</span> <span class="token-type" tabindex="0" data-code-info="type Triplet = (T, T, T)" aria-label="Triplet: type Triplet = (T, T, T)">Triplet</span>[<span class="token-ident" tabindex="0" data-code-info="T: Type" aria-label="T: T: Type">T</span>] <span class="token-punct">=</span> (<span class="token-ident" tabindex="0" data-code-info="T: Type" aria-label="T: T: Type">T</span>, <span class="token-ident" tabindex="0" data-code-info="T: Type" aria-label="T: T: Type">T</span>, <span class="token-ident" tabindex="0" data-code-info="T: Type" aria-label="T: T: Type">T</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"> </span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident" tabindex="0" data-code-info="module Top() -&gt; ()" aria-label="Top: module Top() -&gt; ()">Top</span>() <span class="token-punct">-&gt;</span> () {</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    <span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let triplet: (u1, u1, u1)" aria-label="triplet: let triplet: (u1, u1, u1)">triplet</span><span class="token-punct">:</span> <span class="token-type" tabindex="0" data-code-info="type Triplet = (T, T, T)" aria-label="Triplet: type Triplet = (T, T, T)">Triplet</span>[<span class="token-type">bool</span>] <span class="token-punct">=</span> (<span class="token-ident" tabindex="0" data-code-info="const true: u1" aria-label="true: const true: u1">true</span>, <span class="token-ident" tabindex="0" data-code-info="const false: u1" aria-label="false: const false: u1">false</span>, <span class="token-ident" tabindex="0" data-code-info="const false: u1" aria-label="false: const false: u1">false</span>)</span></div><div class="code-line"><span class="ln">5</span><span class="lt">}</span></div></div>
    
    </section>
<h2 id="module-declarations"><a class="heading-anchor" href="#module-declarations">Module Declarations</a></h2>
<ul>
<li>
<p>Modules enable hierarchical design by encapsulating reusable functionality.</p>
</li>
<li>
<p>A module is defined by a name, an optional list of parameters, and a list of input and output ports.</p>
</li>
</ul>
<section class="code-example" id="ex-module-declarations" aria-label="Example: module declarations">

<h3 id="module-instances"><a class="heading-anchor" href="#module-instances">Module instances</a></h3>
<ul>
<li>
<p>Module instances are first-class values that can be assigned to variables.</p>
</li>
<li>
<p>If a module is parameterised, all the parameters must be specified when creating an instance.</p>
</li>
<li>
<p>Parameter names can be omitted if the parameters are specified in the same order as the declaration.</p>
</li>
</ul>

er: let counter: Reg[u32]">counter</span><span class="token-punct">.</span><span class="token-ident" tabindex="0" data-code-info="output q: T" aria-label="q: output q: T">q</span>,</span></div><div class="code-line"><span class="ln">20</span><span class="lt">        <span class="token-ident" tabindex="0" data-code-info="input b: uint&lt;N&gt;" aria-label="b: input b: uint&lt;N&gt;">b</span><span class="token-punct">:</span> <span class="token-number" tabindex="0" data-code-info="u32" aria-label="32&#39;1: u32">32&#39;1</span>,</span></div><div class="code-line"><span class="ln">21</span><span class="lt">        <span class="token-ident" tabindex="0" data-code-info="input carry_in: u1" aria-label="carry_in: input carry_in: u1">carry_in</span><span class="token-punct">:</span> <span class="token-number" tabindex="0" data-code-info="u1" aria-label="1&#39;0: u1">1&#39;0</span>,</span></div><div class="code-line"><span class="ln">22</span><span class="lt">    )</span></div><div class="code-line"><span class="ln">23</span><span class="lt">}</span></div></div>

<ul>
<li>
<p>A module instance need not assign all ports as the module's ports are accessible as fields of the instance using the <code>.</code> operator.</p>
</li>
<li>
<p>Ports whose values are local variables with the same name can omit the right-hand side of the assignment.</p>
</li>
</ul>
<p>All three <code>Reg</code> instances in the following example are equivalent.</p>
<section class="code-example" id="ex-module-instances-2" aria-label="Example: module instances 2">

    <div class="code-lines" tabindex="0" role="region" aria-label="Source: module instances 2"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident" tabindex="0" data-code-info="module Top(clk: clock, rst: u1) -&gt; ()" aria-label="Top: module Top(clk: clock, rst: u1) -&gt; ()">Top</span>(<span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span><span class="token-punct">:</span> <span class="token-type">clock</span>, <span class="token-ident" tabindex="0" data-code-info="input rst: u1" aria-label="rst: input rst: u1">rst</span><span class="token-punct">:</span> <span class="token-type">bool</span>) <span class="token-punct">-&gt;</span> () {</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let reg1: Reg[u32]" aria-label="reg1: let reg1: Reg[u32]">reg1</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="module Reg[T: Type](clk: clock, d: T, en?: u1, rst?: u1) -&gt; (q: T)" aria-label="Reg: module Reg[T: Type](clk: clock, d: T, en?: u1, rst?: u1) -&gt; (q: T)">Reg</span>[<span class="token-type">u32</span>](<span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span><span class="token-punct">:</span> <span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span>, <span class="token-ident" tabindex="0" data-code-info="input rst: u1" aria-label="rst: input rst: u1">rst</span><span class="token-punct">:</span> <span class="token-ident" tabindex="0" data-code-info="input rst: u1" aria-label="rst: input rst: u1">rst</span>)</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    <span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let reg2: Reg[u32]" aria-label="reg2: let reg2: Reg[u32]">reg2</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="module Reg[T: Type](clk: clock, d: T, en?: u1, rst?: u1) -&gt; (q: T)" aria-label="Reg: module Reg[T: Type](clk: clock, d: T, en?: u1, rst?: u1) -&gt; (q: T)">Reg</span>[<span class="token-type">u32</span>](<span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span>, <span class="token-ident" tabindex="0" data-code-info="input rst: u1" aria-label="rst: input rst: u1">rst</span>)</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    <span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let reg3: Reg[u32]" aria-label="reg3: let reg3: Reg[u32]">reg3</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="module Reg[T: Type](clk: clock, d: T, en?: u1, rst?: u1) -&gt; (q: T)" aria-label="Reg: module Reg[T: Type](clk: clock, d: T, en?: u1, rst?: u1) -&gt; (q: T)">Reg</span>[<span class="token-type">u32</span>]()</span></div><div class="code-line"><span class="ln">5</span><span class="lt"> </span></div><div class="code-line"><span class="ln">6</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="let reg3: Reg[u32]" aria-label="reg3: let reg3: Reg[u32]">reg3</span><span class="token-punct">.</span><span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span></span></div><div class="code-line"><span class="ln">7</span><span class="lt">    <span class="token-ident" tabindex="0" data-code-info="let reg3: Reg[u32]" aria-label="reg3: let reg3: Reg[u32]">reg3</span><span class="token-punct">.</span><span class="token-ident" tabindex="0" data-code-info="input rst: u1" aria-label="rst: input rst: u1">rst</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="input rst: u1" aria-label="rst: input rst: u1">rst</span></span></div><div class="code-line"><span class="ln">8</span><span class="lt">}</span></div></div>
    
    </section>
<h2 id="let-bindings"><a class="heading-anchor" href="#let-bindings">Let Bindings</a></h2>
<ul>
<li>A let binding introduces a named value in the current scope.</li>
<li>Let bindings must be defined inside a module declaration.</li>
<li>The type of the binding is inferred from the right-hand side of the assignment if present
otherwise, the type must be explicitly specified.</li>
</ul>
<section class="code-example" id="ex-let-bindings" aria-label="Example: let bindings">
    <div class="example-header"><span class="example-file">ex-let-bindings.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: let bindings"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let message1: [3]u8" aria-label="message1: let message1: [3]u8">message1</span><span class="token-punct">:</span> [<span class="token-number">3</span>]<span class="token-type">u8</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-ident" tabindex="0" data-code-info="let message1: [3]u8" aria-label="message1: let message1: [3]u8">message1</span> <span class="token-punct">=</span> <span class="token-string" tabindex="0" data-code-info="[3]u8" aria-label="&quot;Yo!&quot;: [3]u8">&quot;Yo!&quot;</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let message2: [3]u8" aria-label="message2: let message2: [3]u8">message2</span> <span class="token-punct">=</span> <span class="token-string" tabindex="0" data-code-info="[3]u8" aria-label="&quot;Hi!&quot;: [3]u8">&quot;Hi!&quot;</span></span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let message3: [3]u8" aria-label="message3: let message3: [3]u8">message3</span><span class="token-punct">:</span> [<span class="token-number">3</span>]<span class="token-type">u8</span> <span class="token-punct">=</span> <span class="token-string" tabindex="0" data-code-info="[3]u8" aria-label="&quot;Hey&quot;: [3]u8">&quot;Hey&quot;</span></span></div></div>
    
    </section>
<h2 id="assignments"><a class="heading-anchor" href="#assignments">Assignments</a></h2>
<p>If a binding is assigned multiple times, only the last assignment is used.</p>

    <div class="example-header"><span class="example-file">ex-assignments.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>

    </section>
<h2 id="block-expressions"><a class="heading-anchor" href="#block-expressions">Block Expressions</a></h2>
<p>Block expressions group multiple statements in a new lexical scope and optionally return a value:</p>
