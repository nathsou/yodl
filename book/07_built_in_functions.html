<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Built-in Functions · Yodl</title><meta name="description" content="Built-in Functions in Yodl. Learn the language with editable examples and inspect the hardware compiler output."><link rel="canonical" href="../playground.html?mode=docs&chapter=07_built_in_functions"><script>location.replace("../playground.html?mode=docs&chapter=07_built_in_functions"+location.hash)</script><style>body{font:16px/1.7 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px}pre{overflow:auto}</style></head>
<body><p><a href="../playground.html?mode=docs&chapter=07_built_in_functions">Open Built-in Functions in the Yodl guide</a></p><noscript><article><h1 id="built-in-functions-and-operations"><a class="heading-anchor" href="#built-in-functions-and-operations">Built-in Functions and Operations</a></h1>
<p>Yodl provides several built-in functions and operations to facilitate hardware design.</p>
<h2 id="type-conversion-functions"><a class="heading-anchor" href="#type-conversion-functions">Type Conversion Functions</a></h2>
<h3 id="uintx"><a class="heading-anchor" href="#uintx"><code>uint!(x)</code></a></h3>
<p>Reinterprets a value as an unsigned integer.</p>
<section class="code-example" id="ex-uint-x" aria-label="Example: uint x">
    <div class="example-header"><span class="example-file">ex-uint-x.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: uint x"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> a<span class="token-punct">:</span> <span class="token-type">s8</span> <span class="token-punct">=</span> <span class="token-punct">-</span><span class="token-number">7&#39;d11</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> b<span class="token-punct">:</span> <span class="token-type">u8</span> <span class="token-punct">=</span> <span class="token-function">uint!</span>(a) <span class="token-comment">// 8&#39;d11</span></span></div></div>
    
    </section>
<p>When applied to a vector of bits, it concatenates them into a single unsigned integer.</p>
<p>Note that the first element of the vector becomes the least significant bit (LSB) of the resulting integer. If you would like the order to be preserved, use the <code>cat!</code> built-in.</p>
<section class="code-example" id="ex-uint-x-2" aria-label="Example: uint x 2">
    <div class="example-header"><span class="example-file">ex-uint-x-2.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: uint x 2"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> bits <span class="token-punct">=</span> [<span class="token-keyword">true</span>, <span class="token-keyword">false</span>, <span class="token-keyword">true</span>, <span class="token-keyword">true</span>]</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-function">assert!</span>(<span class="token-function">uint!</span>(bits) <span class="token-punct">==</span> <span class="token-number">4&#39;b1101</span>)</span></div></div>
    
    </section>
<h3 id="sintx"><a class="heading-anchor" href="#sintx"><code>sint!(x)</code></a></h3>
<p>Reinterprets a value as a signed integer.</p>
<section class="code-example" id="ex-sint-x" aria-label="Example: sint x">
    <div class="example-header"><span class="example-file">ex-sint-x.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: sint x"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> a<span class="token-punct">:</span> <span class="token-type">s8</span> <span class="token-punct">=</span> <span class="token-function">sint!</span>(<span class="token-number">8&#39;b10101010</span>)</span></div></div>
    
    </section>
<h3 id="clockx"><a class="heading-anchor" href="#clockx"><code>clock!(x)</code></a></h3>
<p>Converts a boolean signal to a clock signal.</p>
<section class="code-example" id="ex-clock-x" aria-label="Example: clock x">
    <div class="example-header"><span class="example-file">ex-clock-x.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: clock x"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> counter <span class="token-punct">=</span> <span class="token-ident">Reg</span>[<span class="token-type">u24</span>](clk)</span></div><div class="code-line"><span class="ln">2</span><span class="lt">counter<span class="token-punct">.</span>d <span class="token-punct">=</span> counter<span class="token-punct">.</span>q <span class="token-punct">+</span> <span class="token-number">1</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">let</span> slow_clk <span class="token-punct">=</span> <span class="token-function">clock!</span>(counter<span class="token-punct">.</span>q[<span class="token-number">23</span>]) <span class="token-comment">// Divide the clock by 2^23</span></span></div></div>
    
    </section>
<h2 id="mathematical-functions"><a class="heading-anchor" href="#mathematical-functions">Mathematical Functions</a></h2>
<h3 id="clog2n"><a class="heading-anchor" href="#clog2n"><code>clog2!(n)</code></a></h3>
<p>Computes the ceiling of the base-2 logarithm of <code>n</code>.</p>
<p>Often used to determine the minimum number of bits required to represent a value.</p>
<section class="code-example" id="ex-clog2-n" aria-label="Example: clog2 n">
    <div class="example-header"><span class="example-file">ex-clog2-n.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: clog2 n"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">const</span> <span class="token-ident">AddrWidth</span> <span class="token-punct">=</span> <span class="token-function">clog2!</span>(<span class="token-number">1024</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> addr<span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-ident">AddrWidth</span>] <span class="token-punct">=</span> <span class="token-number">10&#39;d0</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-function">assert!</span>(<span class="token-ident">AddrWidth</span> <span class="token-punct">==</span> <span class="token-number">10</span>)</span></div></div>
    
    </section>
<h3 id="powbase-exp"><a class="heading-anchor" href="#powbase-exp"><code>pow!(base, exp)</code></a></h3>
<p>Computes the power of <code>base</code> raised to <code>exp</code>.</p>
<section class="code-example" id="ex-pow-base-exp" aria-label="Example: pow base exp">
    <div class="example-header"><span class="example-file">ex-pow-base-exp.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: pow base exp"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">const</span> kilobyte <span class="token-punct">=</span> <span class="token-function">pow!</span>(<span class="token-number">2</span>, <span class="token-number">10</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-function">assert!</span>(kilobyte <span class="token-punct">==</span> <span class="token-number">1024</span>)</span></div></div>
    
    </section>
<h3 id="cdiva-b"><a class="heading-anchor" href="#cdiva-b"><code>cdiv!(a, b)</code></a></h3>
<p>Computes the ceiling of the division of <code>a</code> by <code>b</code>.</p>
<section class="code-example" id="ex-cdiv-a-b" aria-label="Example: cdiv a b">
    <div class="example-header"><span class="example-file">ex-cdiv-a-b.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: cdiv a b"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">const</span> data_size <span class="token-punct">=</span> <span class="token-number">1024</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">const</span> block_size <span class="token-punct">=</span> <span class="token-number">100</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">const</span> blocks_needed <span class="token-punct">=</span> <span class="token-function">cdiv!</span>(data_size, block_size)</span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-function">assert!</span>(blocks_needed <span class="token-punct">==</span> <span class="token-number">11</span>)</span></div></div>
    
    </section>
<h2 id="bit-manipulation"><a class="heading-anchor" href="#bit-manipulation">Bit Manipulation</a></h2>
<h3 id="flipx"><a class="heading-anchor" href="#flipx"><code>flip!(x)</code></a></h3>
<p>Reverses the bit order of <code>x</code>.</p>
<section class="code-example" id="ex-flip-x" aria-label="Example: flip x">
    <div class="example-header"><span class="example-file">ex-flip-x.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: flip x"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">const</span> flipped <span class="token-punct">=</span> <span class="token-function">flip!</span>(<span class="token-number">5&#39;b11100</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-function">assert!</span>(flipped <span class="token-punct">==</span> <span class="token-number">5&#39;b00111</span>)</span></div></div>
    
    </section>
<h2 id="vector-functions"><a class="heading-anchor" href="#vector-functions">Vector Functions</a></h2>
<h3 id="catargs"><a class="heading-anchor" href="#catargs"><code>cat!(args...)</code></a></h3>
<p>Concatenates one or more integers (or integer vectors) into a single integer.
The width of the result is the sum of the widths of the arguments. Vectors of
integers are flattened recursively.</p>
<p>If any argument is a signed integer (<code>sint</code>), every argument must be signed.</p>
<section class="code-example" id="ex-cat-args" aria-label="Example: cat args">
    <div class="example-header"><span class="example-file">ex-cat-args.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: cat args"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> upper_nibble <span class="token-punct">=</span> <span class="token-number">8&#39;hAB</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> lower_nibble <span class="token-punct">=</span> <span class="token-number">8&#39;hCD</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">let</span> word <span class="token-punct">=</span> <span class="token-function">cat!</span>(upper_nibble, lower_nibble)</span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-function">assert!</span>(word <span class="token-punct">==</span> <span class="token-number">16&#39;hABCD</span>)</span></div><div class="code-line"><span class="ln">5</span><span class="lt"> </span></div><div class="code-line"><span class="ln">6</span><span class="lt"><span class="token-comment">// Vectors are flattened</span></span></div><div class="code-line"><span class="ln">7</span><span class="lt"><span class="token-keyword">let</span> from_vec <span class="token-punct">=</span> <span class="token-function">cat!</span>([<span class="token-number">16&#39;hBABA</span>, <span class="token-number">16&#39;hFABE</span>])</span></div><div class="code-line"><span class="ln">8</span><span class="lt"><span class="token-function">assert!</span>(from_vec <span class="token-punct">==</span> <span class="token-number">32&#39;hBABAFABE</span>)</span></div></div>
    
    </section>
<h3 id="filln-x"><a class="heading-anchor" href="#filln-x"><code>fill!(n, x)</code></a></h3>
<p>Produces a vector <code>[n]T</code> containing <code>n</code> copies of <code>x</code>. For bit-replication
(SystemVerilog <code>{n{x}}</code>), combine with <code>cat!</code>:</p>
<section class="code-example" id="ex-fill-n-x" aria-label="Example: fill n x">
    <div class="example-header"><span class="example-file">ex-fill-n-x.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: fill n x"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> zeros<span class="token-punct">:</span> [<span class="token-number">4</span>]<span class="token-type">u1</span> <span class="token-punct">=</span> <span class="token-function">fill!</span>(<span class="token-number">4</span>, <span class="token-number">1&#39;b0</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> mask<span class="token-punct">:</span>  <span class="token-type">u4</span> <span class="token-punct">=</span> <span class="token-function">cat!</span>(<span class="token-function">fill!</span>(<span class="token-number">4</span>, <span class="token-number">1&#39;b1</span>))   <span class="token-comment">// 4&#39;b1111</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-function">assert!</span>(<span class="token-function">uint!</span>(zeros) <span class="token-punct">==</span> <span class="token-number">4&#39;d0</span>)</span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-function">assert!</span>(mask <span class="token-punct">==</span> <span class="token-number">4&#39;b1111</span>)</span></div></div>
    
    </section>
<h3 id="revvec"><a class="heading-anchor" href="#revvec"><code>rev!(vec)</code></a></h3>
<p>Reverses the order of elements in a vector.</p>
<p>Particularly useful when constructing a bit vector from a list of bits from most to least significant
since vectors are indexed from least to most significant, i.e. <code>vec[0]</code> is the first element.</p>
<section class="code-example" id="ex-rev-vec" aria-label="Example: rev vec">
    <div class="example-header"><span class="example-file">ex-rev-vec.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: rev vec"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> reversed <span class="token-punct">=</span> <span class="token-function">rev!</span>([<span class="token-number">1&#39;1</span>, <span class="token-number">1&#39;0</span>, <span class="token-number">1&#39;0</span>, <span class="token-number">1&#39;0</span>])</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-function">assert!</span>(reversed[<span class="token-number">0</span>] <span class="token-punct">==</span> <span class="token-number">1&#39;0</span>)</span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-function">assert!</span>(reversed[<span class="token-number">1</span>] <span class="token-punct">==</span> <span class="token-number">1&#39;0</span>)</span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-function">assert!</span>(reversed[<span class="token-number">2</span>] <span class="token-punct">==</span> <span class="token-number">1&#39;0</span>)</span></div><div class="code-line"><span class="ln">5</span><span class="lt"><span class="token-function">assert!</span>(reversed[<span class="token-number">3</span>] <span class="token-punct">==</span> <span class="token-number">1&#39;1</span>)</span></div></div>
    
    </section>
<h3 id="padx-width"><a class="heading-anchor" href="#padx-width"><code>pad!(x, width)</code></a></h3>
<p>Extends the bit-width of an integer <code>x</code> to <code>width</code> bits.
If <code>x</code> is signed, it performs sign-extension; if <code>x</code> is unsigned, it performs zero-extension:</p>
<table>
<thead>
<tr><th>type of <code>x</code></th><th>pad!(x, width)</th></tr>
</thead>
<tbody>
<tr><td>sint[W]</td><td>sign-extend</td></tr>
<tr><td>uint[W]</td><td>zero-extend</td></tr>
</tbody>
</table>
<section class="code-example" id="ex-pad-x-width" aria-label="Example: pad x width">
    <div class="example-header"><span class="example-file">ex-pad-x-width.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: pad x width"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> a <span class="token-punct">=</span> <span class="token-punct">-</span><span class="token-number">4&#39;d3</span> <span class="token-comment">// 5&#39;b1101</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> b<span class="token-punct">:</span> <span class="token-type">s8</span> <span class="token-punct">=</span> <span class="token-function">pad!</span>(a, <span class="token-number">8</span>) <span class="token-comment">// 8&#39;b11111101 (sign-extended)</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-function">assert!</span>(<span class="token-function">uint!</span>(b) <span class="token-punct">==</span> <span class="token-number">8&#39;b11111101</span>)</span></div><div class="code-line"><span class="ln">4</span><span class="lt"><span class="token-keyword">let</span> c<span class="token-punct">:</span> <span class="token-type">u4</span> <span class="token-punct">=</span> <span class="token-number">4&#39;d3</span> <span class="token-comment">// 4&#39;b0011</span></span></div><div class="code-line"><span class="ln">5</span><span class="lt"><span class="token-keyword">let</span> d<span class="token-punct">:</span> <span class="token-type">u8</span> <span class="token-punct">=</span> <span class="token-function">pad!</span>(c, <span class="token-number">8</span>) <span class="token-comment">// 8&#39;b00000011 (zero-extended)</span></span></div><div class="code-line"><span class="ln">6</span><span class="lt"><span class="token-function">assert!</span>(d <span class="token-punct">==</span> <span class="token-number">8&#39;b00000011</span>)</span></div></div>
    
    </section>
<h2 id="memory-functions"><a class="heading-anchor" href="#memory-functions">Memory Functions</a></h2>
<p>Yodl provides familiar <a href="https://projectf.io/posts/initialize-memory-in-verilog/"><code>$readmemb</code> and <code>$readmemh</code></a> functions to initialize Memory instances from files.</p>
<h3 id="readmembfile-memory"><a class="heading-anchor" href="#readmembfile-memory"><code>readmemb!(file, memory)</code></a></h3>
<p>Initializes a memory from a binary format file.</p>
<section class="code-example" id="ex-readmemb-file-memory" aria-label="Example: readmemb file memory">
    <div class="example-header"><span class="example-file">ex-readmemb-file-memory.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: readmemb file memory"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> rom <span class="token-punct">=</span> <span class="token-ident">Memory</span>[</span></div><div class="code-line"><span class="ln">2</span><span class="lt">    <span class="token-ident">T</span><span class="token-punct">:</span> <span class="token-type">u8</span>,</span></div><div class="code-line"><span class="ln">3</span><span class="lt">    <span class="token-ident">Depth</span><span class="token-punct">:</span> <span class="token-number">256</span>,</span></div><div class="code-line"><span class="ln">4</span><span class="lt">    <span class="token-ident">ReadPorts</span><span class="token-punct">:</span> <span class="token-number">1</span>,</span></div><div class="code-line"><span class="ln">5</span><span class="lt">    <span class="token-ident">WritePorts</span><span class="token-punct">:</span> <span class="token-number">0</span>,</span></div><div class="code-line"><span class="ln">6</span><span class="lt">](</span></div><div class="code-line"><span class="ln">7</span><span class="lt">    read<span class="token-punct">:</span> [(clk<span class="token-punct">:</span> clk, en<span class="token-punct">:</span> <span class="token-keyword">true</span>, addr<span class="token-punct">:</span> addr)],</span></div><div class="code-line"><span class="ln">8</span><span class="lt">)</span></div><div class="code-line"><span class="ln">9</span><span class="lt"> </span></div><div class="code-line"><span class="ln">10</span><span class="lt"><span class="token-comment">// Initialize memory from binary file</span></span></div><div class="code-line"><span class="ln">11</span><span class="lt"><span class="token-function">readmemb!</span>(<span class="token-string">&quot;rom_data.bin&quot;</span>, rom)</span></div><div class="code-line"><span class="ln">12</span><span class="lt"> </span></div><div class="code-line"><span class="ln">13</span><span class="lt"><span class="token-keyword">let</span> data <span class="token-punct">=</span> rom<span class="token-punct">.</span>q[<span class="token-number">0</span>]</span></div></div>
    
    </section>
<h3 id="readmemhfile-memory"><a class="heading-anchor" href="#readmemhfile-memory"><code>readmemh!(file, memory)</code></a></h3>
<p>Initializes a memory from a hexadecimal format file.</p>

n></div><div class="code-line"><span class="ln">13</span><span class="lt"><span class="token-keyword">let</span> data <span class="token-punct">=</span> rom<span class="token-punct">.</span>q[<span class="token-number">0</span>]</span></div></div>
    
    </section>

<h3 id="assertpredicate-format_string-args"><a class="heading-anchor" href="#assertpredicate-format_string-args"><code>assert!(predicate, [format_string, args..])</code></a></h3>
<p>Asserts that the predicate is true. If the predicate is false, the simulation stops and prints an optional error message.</p>
<section class="code-example" id="ex-assert-predicate-format-string-args" aria-label="Example: assert predicate format string args">
    <div class="example-header"><span class="example-file">ex-assert-predicate-format-string-args.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: assert predicate format string args"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-function">assert!</span>(<span class="token-keyword">true</span> <span class="token-punct">==</span> <span class="token-number">1&#39;b1</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">const</span> two_plus_two <span class="token-punct">=</span> <span class="token-number">2</span> <span class="token-punct">+</span> <span class="token-number">2</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-function">assert!</span>(two_plus_two <span class="token-punct">==</span> <span class="token-number">4</span>, <span class="token-string">&quot;Math is broken, expected 4, got %d&quot;</span>, two_plus_two)</span></div></div>
    
    </section>
