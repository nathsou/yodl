<body><p><a href="../playground.html?mode=docs&chapter=07_built_in_functions">Open Built-in Functions in the Yodl guide</a></p><noscript><article><h1 id="built-in-functions-and-operations"><a class="heading-anchor" href="#built-in-functions-and-operations">Built-in Functions and Operations</a></h1>
<p>Yodl provides several built-in functions and operations to facilitate hardware design.</p>
<h2 id="type-conversion-functions"><a class="heading-anchor" href="#type-conversion-functions">Type Conversion Functions</a></h2>
<h3 id="uintx"><a class="heading-anchor" href="#uintx"><code>uint!(x)</code></a></h3>
<p>Reinterprets a value as an unsigned integer.</p>
<section class="code-example" id="ex-uint-x" aria-label="Example: uint x">
    <div class="example-header"><span class="example-file">ex-uint-x.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: uint x"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let a: s8" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;let&lt;/span&gt; a&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;s8&lt;/span&gt;" aria-label="a: let a: s8">a</span><span class="token-punct">:</span> <span class="token-type">s8</span> <span class="token-punct">=</span> <span class="token-punct">-</span><span class="token-number" tabindex="0" data-code-info="u7" data-code-tooltip="&lt;span class=&quot;token-type&quot;&gt;u7&lt;/span&gt;" aria-label="7&#39;d11: u7">7&#39;d11</span></span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let b: u8" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;let&lt;/span&gt; b&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u8&lt;/span&gt;" aria-label="b: let b: u8">b</span><span class="token-punct">:</span> <span class="token-type">u8</span> <span class="token-punct">=</span> <span class="token-function" tabindex="0" data-code-info="uint!(value: sint) -&gt; uint" data-code-tooltip="&lt;span class=&quot;token-function&quot;&gt;uint!&lt;/span&gt;(value&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;sint&lt;/span&gt;) &lt;span class=&quot;token-punct&quot;&gt;-&amp;gt;&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;uint&lt;/span&gt;" aria-label="uint!: uint!(value: sint) -&gt; uint">uint!</span>(<span class="token-ident" tabindex="0" data-code-info="let a: s8" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;let&lt;/span&gt; a&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;s8&lt;/span&gt;" aria-label="a: let a: s8">a</span>) <span class="token-comment">// 8&#39;d11</span></span></div></div>
    
    </section>
<p>When applied to a vector of bits, it concatenates them into a single unsigned integer.</p>
<p>Note that the first element of the vector becomes the least significant bit (LSB) of the resulting integer. If you would like the order to be preserved, use the <code>cat!</code> built-in.</p>
<section class="code-example" id="ex-uint-x-2" aria-label="Example: uint x 2">

    <div class="code-lines" tabindex="0" role="region" aria-label="Source: uint x 2"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let bits: [4]u1" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;let&lt;/span&gt; bits&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; [&lt;span class=&quot;token-number&quot;&gt;4&lt;/span&gt;]&lt;span class=&quot;token-type&quot;&gt;u1&lt;/span&gt;" aria-label="bits: let bits: [4]u1">bits</span> <span class="token-punct">=</span> [<span class="token-ident" tabindex="0" data-code-info="const true: u1" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;const&lt;/span&gt; &lt;span class=&quot;token-keyword&quot;&gt;true&lt;/span&gt;&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u1&lt;/span&gt;" aria-label="true: const true: u1">true</span>, <span class="token-ident" tabindex="0" data-code-info="const false: u1" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;const&lt;/span&gt; &lt;span class=&quot;token-keyword&quot;&gt;false&lt;/span&gt;&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u1&lt;/span&gt;" aria-label="false: const false: u1">false</span>, <span class="token-ident" tabindex="0" data-code-info="const true: u1" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;const&lt;/span&gt; &lt;span class=&quot;token-keyword&quot;&gt;true&lt;/span&gt;&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u1&lt;/span&gt;" aria-label="true: const true: u1">true</span>, <span class="token-ident" tabindex="0" data-code-info="const true: u1" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;const&lt;/span&gt; &lt;span class=&quot;token-keyword&quot;&gt;true&lt;/span&gt;&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u1&lt;/span&gt;" aria-label="true: const true: u1">true</span>]</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" data-code-tooltip="&lt;span class=&quot;token-function&quot;&gt;assert!&lt;/span&gt;(condition&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;bool&lt;/span&gt;)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-function" tabindex="0" data-code-info="uint!(value: sint) -&gt; uint" data-code-tooltip="&lt;span class=&quot;token-function&quot;&gt;uint!&lt;/span&gt;(value&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;sint&lt;/span&gt;) &lt;span class=&quot;token-punct&quot;&gt;-&amp;gt;&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;uint&lt;/span&gt;" aria-label="uint!: uint!(value: sint) -&gt; uint">uint!</span>(<span class="token-ident" tabindex="0" data-code-info="let bits: [4]u1" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;let&lt;/span&gt; bits&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; [&lt;span class=&quot;token-number&quot;&gt;4&lt;/span&gt;]&lt;span class=&quot;token-type&quot;&gt;u1&lt;/span&gt;" aria-label="bits: let bits: [4]u1">bits</span>) <span class="token-punct">==</span> <span class="token-number" tabindex="0" data-code-info="u4" data-code-tooltip="&lt;span class=&quot;token-type&quot;&gt;u4&lt;/span&gt;" aria-label="4&#39;b1101: u4">4&#39;b1101</span>)</span></div></div>
    
    </section>
<h3 id="sintx"><a class="heading-anchor" href="#sintx"><code>sint!(x)</code></a></h3>

<h3 id="clockx"><a class="heading-anchor" href="#clockx"><code>clock!(x)</code></a></h3>
<p>Converts a boolean signal to a clock signal.</p>

:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;clock&lt;/span&gt;" aria-label="clk: input clk: clock">clk</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-ident" tabindex="0" data-code-info="let counter: Reg[u24]" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;let&lt;/span&gt; counter&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-ident&quot;&gt;Reg&lt;/span&gt;[&lt;span class=&quot;token-type&quot;&gt;u24&lt;/span&gt;]" aria-label="counter: let counter: Reg[u24]">counter</span><span class="token-punct">.</span><span class="token-ident" tabindex="0" data-code-info="input d: T" data-code-tooltip="input d&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-ident&quot;&gt;T&lt;/span&gt;" aria-label="d: input d: T">d</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="let counter: Reg[u24]" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;let&lt;/span&gt; counter&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-ident&quot;&gt;Reg&lt;/span&gt;[&lt;span class=&quot;token-type&quot;&gt;u24&lt;/span&gt;]" aria-label="counter: let counter: Reg[u24]">counter</span><span class="token-punct">.</span><span class="token-ident" tabindex="0" data-code-info="output q: T" data-code-tooltip="output q&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-ident&quot;&gt;T&lt;/span&gt;" aria-label="q: output q: T">q</span> <span class="token-punct">+</span> <span class="token-number" tabindex="0" data-code-info="u1" data-code-tooltip="&lt;span class=&quot;token-type&quot;&gt;u1&lt;/span&gt;" aria-label="1: u1">1</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let slow_clk: clock" data-code-toolti <h2 id="mathematical-functions"><a class="heading-anchor" href="#mathematical-functions">Mathematical Functions</a></h2>
<h3 id="clog2n"><a class="heading-anchor" href="#clog2n"><code>clog2!(n)</code></a></h3>
<p>Computes the ceiling of the base-2 logarithm of <code>n</code>.</p>
<p>Often used to determine the minimum number of bits required to represent a value.</p>
<section class="code-example" id="ex-clog2-n" aria-label="Example: clog2 n">
    <div class="example-header"><span class="example-file">ex-clog2-n.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: clog2 n"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">const</span> <span class="token-ident" tabindex="0" data-code-info="const AddrWidth: u4" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;const&lt;/span&gt; &lt;span class=&quot;token-ident&quot;&gt;AddrWidth&lt;/span&gt;&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u4&lt;/span&gt;" aria-label="AddrWidth: const AddrWidth: u4">AddrWidth</span> <span class="token-punct">=</span> <span class="token-function" tabindex="0" data-code-info="clog2!(value: Nat) -&gt; Nat" data-code-tooltip="&lt;span class=&quot;token-function&quot;&gt;clog2!&lt;/span&gt;(value&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;Nat&lt;/span&gt;) &lt;span class=&quot;token-punct&quot;&gt;-&amp;gt;&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;Nat&lt;/span&gt;" aria-label="clog2!: clog2!(value: Nat) -&gt; Nat">clog2!</span>(<span class="token-number">1024</span>)</span></div><div class="code-line"><span class="ln">2</span><span class="lt"><span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let addr: u10" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;let&lt;/span&gt; addr&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u10&lt;/span&gt;" aria-label="addr: let addr: u10">addr</span><span class="token-punct">:</span> <span class="token-type">uint</span>[<span class="token-ident" tabindex="0" data-code-info="const AddrWidth: u4" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;const&lt;/span&gt; &lt;span class=&quot;token-ident&quot;&gt;AddrWidth&lt;/span&gt;&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u4&lt;/span&gt;" aria-label="AddrWidth: const AddrWidth: u4">AddrWidth</span>] <span class="token-punct">=</span> <span class="token-number" tabindex="0" data-code-info="u10" data-code-tooltip="&lt;span class=&quot;token-type&quot;&gt;u10&lt;/span&gt;" aria-label="10&#39;d0: u10">10&#39;d0</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt"><span class="token-function" tabindex="0" data-code-info="assert!(condition: bool)" data-code-tooltip="&lt;span class=&quot;token-function&quot;&gt;assert!&lt;/span&gt;(condition&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;bool&lt;/span&gt;)" aria-label="assert!: assert!(condition: bool)">assert!</span>(<span class="token-ident" tabindex="0" data-code-info="const AddrWidth: u4" data-code-tooltip="&lt;span class=&quot;token-keyword&quot;&gt;const&lt;/span&gt; &lt;span class=&quot;token-ident&quot;&gt;AddrWidth&lt;/span&gt;&lt;span class=&quot;token-punct&quot;&gt;:&lt;/span&gt; &lt;span class=&quot;token-type&quot;&gt;u4&lt;/span&gt;" aria-label="AddrWidth: const AddrWidth: u4">AddrWidth</span> <span class="token-punct">==</span> <span class="token-number">10</span>)</span></div></div>
    
    </section>
<h3 id="powbase-exp"><a class="heading-anchor" href="#powbase-exp"><code>pow!(base, exp)</code></a></h3>
<p>Computes the power of <code>base</code> raised to <code>exp</code>.</p>

<h3 id="revvec"><a class="heading-anchor" href="#revvec"><code>rev!(vec)</code></a></h3>
<p>Reverses the order of elements in a vector.</p>
<p>Particularly useful when constructing a bit vector from a list of bits from most to least significant
since vectors are indexed from least to most significant, i.e. <code>vec[0]</code> is the first element.</p>

<h3 id="padx-width"><a class="heading-anchor" href="#padx-width"><code>pad!(x, width)</code></a></h3>
<p>Extends the bit-width of an integer <code>x</code> to <code>width</code> bits.
If <code>x</code> is signed, it performs sign-extension; if <code>x</code> is unsigned, it performs zero-extension:</p>

<thead>
<tr><th>type of <code>x</code></th><th>pad!(x, width)</th></tr>
</thead>
<tbody>
<tr><td>sint[W]</td><td>sign-extend</td></tr>
<tr><td>uint[W]</td><td>zero-extend</td></tr>
</tbody>
</table>
