<body><p><a href="../playground.html?mode=docs&chapter=02_getting_started">Open Getting Started in the Yodl guide</a></p><noscript><article><h1 id="getting-started"><a class="heading-anchor" href="#getting-started">Getting started</a></h1>
<p>To try Yodl directly in your browser, <a href="https://nathsou.github.io/yodl/playground.html">visit the playground</a>.</p>
<h2 id="installation"><a class="heading-anchor" href="#installation">Installation</a></h2>
<p>The simplest way to get yodl is to install the bundled npm package:</p>
<pre><code class="language-bash">$ npm install --global yodl
$ yodl examples/Hello.yodl &quot;write_firrtl Hello.fir&quot;
</code></pre>
<p>.fir files can then be converted to SystemVerilog using <a href="https://github.com/llvm/circt/releases">firtool</a> (tested with version 1.111.1).</p>
<p>Feature support for SystemVerilog/Verilog differs from tool to tool, check <a href="https://circt.llvm.org/docs/VerilogGeneration/#recommended-loweringoptions-by-target">this page</a> to customise the output.
When using Yosys for instance, specify <code>--lowering-options=disallowPackedArrays,disallowLocalVariables,emitBindComments</code>.</p>
<pre><code class="language-bash">firtool --format=fir --verilog Hello.fir -o Hello.sv
</code></pre>
<p>The project can also be compiled to wasm or wasm-gc by installing <a href="https://www.moonbitlang.com/">Moonbit</a> and running:</p>
<pre><code class="language-bash">$ git clone https://github.com/nathsou/yodl
$ cd yodl
$ moon build --target wasm-gc
$ moon run src/main examples/Hello.yodl &quot;write_firrtl Hello.fir&quot;
</code></pre>
<h2 id="editor-support"><a class="heading-anchor" href="#editor-support">Editor support</a></h2>
<h3 id="visual-studio-code"><a class="heading-anchor" href="#visual-studio-code">Visual Studio Code</a></h3>
<p>A syntax-highlighting extension is embedded in the repository, to install it, do:</p>
<ol>
<li>Open the command palette (Ctrl | Cmd + Shift + P)</li>
<li>Select 'Developer: Install Extension from Location'</li>
<li>Open 'extensions/yodl-vscode-syntax'</li>
</ol>
<h2 id="your-first-yodl-design"><a class="heading-anchor" href="#your-first-yodl-design">Your first Yodl design</a></h2>
<p>Create a file called <code>Blink.yodl</code> and insert the following text:</p>
<section class="code-example" id="ex-your-first-yodl-design" aria-label="Example: your first yodl design">
    <div class="example-header"><span class="example-file">ex-your-first-yodl-design.yodl</span><span class="example-actions"><button type="button" data-action="compile" class="js-only">Compile ▸</button><button type="button" data-action="playground" class="js-only">Open in Playground ↗</button></span></div>
    <div class="code-lines" tabindex="0" role="region" aria-label="Source: your first yodl design"><div class="code-line"><span class="ln">1</span><span class="lt"><span class="token-keyword">module</span> <span class="token-ident" tabindex="0" data-code-info="module Top(clk: clock, rst: u1) -&gt; (leds: u8)" aria-label="Top: module Top(clk: clock, rst: u1) -&gt; (leds: u8)">Top</span>(</span></div><div class="code-line"><span class="ln">2</span><span class="lt">  <span class="token-comment">// inputs</span></span></div><div class="code-line"><span class="ln">3</span><span class="lt">  <span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span><span class="token-punct">:</span> <span class="token-type">clock</span>,</span></div><div class="code-line"><span class="ln">4</span><span class="lt">  <span class="token-ident" tabindex="0" data-code-info="input rst: u1" aria-label="rst: input rst: u1">rst</span><span class="token-punct">:</span> <span class="token-type">bool</span>,</span></div><div class="code-line"><span class="ln">5</span><span class="lt">) <span class="token-punct">-&gt;</span> (</span></div><div class="code-line"><span class="ln">6</span><span class="lt">  <span class="token-comment">// outputs</span></span></div><div class="code-line"><span class="ln">7</span><span class="lt">  <span class="token-ident" tabindex="0" data-code-info="output leds: u8" aria-label="leds: output leds: u8">leds</span><span class="token-punct">:</span> <span class="token-type">u8</span>,</span></div><div class="code-line"><span class="ln">8</span><span class="lt">) {</span></div><div class="code-line"><span class="ln">9</span><span class="lt">  <span class="token-keyword">let</span> <span class="token-ident" tabindex="0" data-code-info="let counter: Reg[u24]" aria-label="counter: let counter: Reg[u24]">counter</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="module Reg[T: Type](clk: clock, d: T, en?: u1, rst?: u1) -&gt; (q: T)" aria-label="Reg: module Reg[T: Type](clk: clock, d: T, en?: u1, rst?: u1) -&gt; (q: T)">Reg</span>[<span class="token-type">u24</span>](<span class="token-ident" tabindex="0" data-code-info="input clk: clock" aria-label="clk: input clk: clock">clk</span>, <span class="token-ident" tabindex="0" data-code-info="input rst: u1" aria-label="rst: input rst: u1">rst</span>)</span></div><div class="code-line"><span class="ln">10</span><span class="lt">  <span class="token-ident" tabindex="0" data-code-info="let counter: Reg[u24]" aria-label="counter: let counter: Reg[u24]">counter</span><span class="token-punct">.</span><span class="token-ident" tabindex="0" data-code-info="input d: T" aria-label="d: input d: T">d</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="let counter: Reg[u24]" aria-label="counter: let counter: Reg[u24]">counter</span><span class="token-punct">.</span><span class="token-ident" tabindex="0" data-code-info="output q: T" aria-label="q: output q: T">q</span> <span class="token-punct">+</span> <span class="token-number" tabindex="0" data-code-info="u1" aria-label="1&#39;d1: u1">1&#39;d1</span></span></div><div class="code-line"><span class="ln">11</span><span class="lt">  <span class="token-ident" tabindex="0" data-code-info="output leds: u8" aria-label="leds: output leds: u8">leds</span> <span class="token-punct">=</span> <span class="token-ident" tabindex="0" data-code-info="let counter: Reg[u24]" aria-label="counter: let counter: Reg[u24]">counter</span><span class="token-punct">.</span><span class="token-ident" tabindex="0" data-code-info="output q: T" aria-label="q: output q: T">q</span>[<span class="token-number" tabindex="0" data-code-info="u5" aria-label="23: u5">23</span><span class="token-punct">:</span><span class="token-number" tabindex="0" data-code-info="u5" aria-label="16: u5">16</span>]</span></div><div class="code-line"><span class="ln">12</span><span class="lt">}</span></div></div>
    
    </section>
<p>This simple design creates a 24-bit counter and displays the 8 most-significant bits to the output <code>leds</code> port.</p>
<h2 id="key-features"><a class="heading-anchor" href="#key-features">Key Features</a></h2>
<p>Yodl provides several key features for hardware design:</p>
<ul>
<li><strong>Type-safe hardware description</strong>: Strong typing prevents many common hardware design errors</li>
<li><strong>Primitive modules</strong>: Built-in registers, memories, and other essential building blocks</li>
<li><strong>External module integration</strong>: Seamlessly integrate existing Verilog modules (see <a href="./09_external_modules.html">External Modules</a>)</li>
</ul>
<h2 id="compilation-process"><a class="heading-anchor" href="#compilation-process">Compilation Process</a></h2>
<p>To convert this Yodl design to FIRRTL:</p>
<pre><code class="language-bash">yodl Blink.yodl &quot;write_firrtl Blink.fir&quot;
</code></pre>
<p>Which should output:</p>
<pre><code class="language-fir">FIRRTL version 4.1.0
circuit Top:
  public module Top:
    input clk: Clock
    input rst: UInt&lt;1&gt;
    output leds: UInt&lt;8&gt;

    wire counter: { flip d: UInt&lt;24&gt;, q: UInt&lt;24&gt; }
    regreset reg_0: UInt&lt;24&gt;, clk, rst, UInt&lt;24&gt;(0)
    connect counter.q, reg_0
    connect reg_0, counter.d
    connect counter.d, counter.q
    node temp_1 = bits(add(counter.q, UInt&lt;1&gt;(1)), 24, 0)
    connect counter.d, temp_1
    node temp_2 = bits(counter.q, 23, 16)
    connect leds, temp_2
</code></pre>
<p>Now to generate a SystemVerilog file:</p>
<pre><code class="language-bash">firtool --format=fir -O=release --verilog \
      -disable-all-randomization -strip-debug-info \
      --lowering-options=disallowPackedArrays,disallowLocalVariables \
      Blink.fir -o Blink.sv 
</code></pre>
<p>Which should output a file similar to:</p>
<pre><code class="language-SystemVerilog">// Generated by CIRCT firtool-1.149.0
module Top(
  input        clk,
               rst,
  output [7:0] leds
);

  reg [23:0] reg_0;
  always @(posedge clk) begin
    if (rst)
      reg_0 &lt;= 24'h0;
    else
      reg_0 &lt;= reg_0 + 24'h1;
  end // always @(posedge)
  assign leds = reg_0[23:16];
endmodule
</code></pre>
